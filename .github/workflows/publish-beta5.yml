name: Publish authorized PE beta.5
on:
  push:
    branches: [feat/beta5-simple-onboarding]
    paths: [.github/workflows/publish-beta5.yml]
permissions:
  contents: write
  checks: read
  actions: read
  pull-requests: write
concurrency:
  group: publish-pe-v0.1.0-beta.5
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PE_SOURCE: a4ede923e42573def49026a8d1d817c37a979171
      PE_TAG: v0.1.0-beta.5
      PE_TAG_OBJECT: 7a919061010e1a018a54235e96711ff4295622a7
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v0.1.0-beta.5
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.8'
      - uses: astral-sh/setup-uv@v6
      - name: Verify immutable authorized source and successful checks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PE_SOURCE"
          test "$(git rev-parse "$PE_TAG")" = "$PE_TAG_OBJECT"
          test "$(git cat-file -t "$PE_TAG")" = "tag"
          test "$(git rev-parse "$PE_TAG^{commit}")" = "$PE_SOURCE"
          python - <<'PY_CHECK'
          import json, os, subprocess, time
          sha=os.environ['PE_SOURCE']
          for attempt in range(30):
              result=json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/commits/{sha}/check-runs']))
              checks=result['check_runs']
              if len(checks)>=15 and all(c['status']=='completed' and c['conclusion']=='success' for c in checks):
                  break
              if any(c['status']=='completed' and c['conclusion'] not in ('success',) for c in checks):
                  raise SystemExit('Exact-source CI did not pass; publication prohibited')
              time.sleep(10)
          else:
              raise SystemExit('Exact-source CI is still pending; publication prohibited')
          PY_CHECK
      - name: Build clean source and independently install both layouts
        run: |
          set -euo pipefail
          uv venv
          uv pip sync --require-hashes requirements-ha-current.lock
          uv run --no-project python tools/build_beta.py
          python - <<'PY_INTEGRITY'
          import hashlib,json,os
          from pathlib import Path
          manifest=json.loads(Path('dist/BUILD_MANIFEST.json').read_text())
          assert manifest['commit']==os.environ['PE_SOURCE'] and not manifest['dirty']
          expected={'ha_energy_price_engine.zip':'9f8ea839a04b5d67f61dc0e49f11611abcb4c85cdfced809f813937548dc0ad0', 'ha_energy_price_engine-manual.zip':'422c5d1bb39c4596a4af36db2e325ad56b642b8287e2bc09409d96a5928d3036'}
          assert manifest['archives']==expected
          for name,digest in expected.items():
              assert hashlib.sha256((Path('dist')/name).read_bytes()).hexdigest()==digest
          PY_INTEGRITY
          uv run --no-project python tools/smoke_install_package.py dist/ha_energy_price_engine.zip
          uv run --no-project python tools/smoke_install_package.py dist/ha_energy_price_engine-manual.zip
      - name: Publish authorized immutable beta.5 only
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/pe-beta5-notes.md" <<'PE_NOTES'
          Beta.5 replaces ordinary draft/date editing with **five native setup stages that save each accepted page**: site/source → grid → supplier agreement → taxes → numerical review. Close and reopen Configure to resume. Review needs no final save.
          
          **Prerelease for development Home Assistant acceptance testing.** Private contracts, real sources and hardware still require your own checks.
          
          Source: **a4ede923e42573def49026a8d1d817c37a979171**. Immutable tag: **v0.1.0-beta.5**. [Draft PR #14](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/pull/14) remains unmerged. Prior releases and main are preserved.
          
          ## Install or update
          
          1. Back up development HA. Add `https://github.com/NicolaiTandrup/HA-Energy-Price-Engine` to HACS custom repositories as **Integration** if needed.
          2. Open Energy Price Engine, persist **Show beta versions**, refresh information, select **v0.1.0-beta.5**, download and restart HA. Device info must show **0.1.0-beta.5**.
          3. Existing sites: choose **Configure** on the existing entry. New sites: install/configure the official Home Assistant Nord Pool integration first, then Add integration → Energy Price Engine. A legacy live broker is unnecessary; use recorded data for offline comparisons.
          4. Confirm the actual area/grid product. Choose a freshly verified public EWII offer and confirm your actual agreement, or enter your own markup in **øre/kWh**, VAT inclusion and optional monthly fee. Ordinary setup needs no dates. Save and continue applies each page.
          5. Review the eight component rates/source/status rows. Click a row to edit; **Check prices** forces verification. Final prices opens Diagnostics; Advanced holds dated overrides, display and site/storage tools. Compare a stored quarter with your bill and restart.
          
          [Illustrated setup and short demos](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/v0.1.0-beta.5/docs/WIZARD_GUIDE.md) · [Exact HACS steps](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/v0.1.0-beta.5/docs/HACS_DISTRIBUTION.md) · [Acceptance checklist](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/v0.1.0-beta.5/docs/BETA_ACCEPTANCE.md) · [Native simulation evidence](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/v0.1.0-beta.5/docs/receipts/v0.1.0-beta.5-simulation.json)
          
          ## Changes and pricing safety
          
          - Each accepted source/grid/agreement/tax step is actual persisted HA configuration. Saved confirmations and close/reopen resume replace hidden drafts. Direct review edits return to review and preserve other components. Closing cannot submit fields still being typed; submit the page first.
          - Official Nord Pool entry metadata supplies supported area, timezone and input conventions. Multiple supported areas require explicit selection. DK1/DK2 never proves a customer's grid operator/class; Radius C requires confirmation.
          - EWII Basis/Plus suggestions use official primary product statements, source URL/time/hash and a maximum 24h fallback. Observed October 27: Basis 16.5øre/0DKK monthly, Plus 6.5øre/29DKK monthly. These are public offers, never permanent private defaults. Official pages do not clearly establish the markup VAT convention, so the user must confirm it from their agreement. Unavailable/stale suggestions are withheld; manual input remains.
          - Current confirmed rates start at the **next complete quarter**, open-ended until changed. Existing historical rules and scheduled future date/hour overrides are preserved. Earlier unknown intervals are never filled and settled rows never rewritten. The initial day can have only remaining-day coverage; full-day consumer reads remain INCOMPLETE, while complete active future ranges can be READY.
          - Compact English/Danish component checklist shows actual numerical prices including VAT, with direct settings links. Diagnostics retain applied canonical values, periods, sources/status and corrective actions. Raw source readiness stays separate from final readiness. Monthly subscriptions stay outside marginal prices.
          - Explicitly approved provisional rates remain separate **ESTIMATED / UNVERIFIED visualization-only** values. They never enter verified SQLite history, publish authoritative revisions or give CM READY prices. Missing rates never become zero. Do not use estimates for charging control.
          - Existing beta.1–.4 IDs, names, source references, entities, dated overrides, SQLite rows/revisions and read-only API v1 are preserved. Transactional touched-row SQLite persistence, safe selected-site deletion, native device version/branding and PE-only HACS beta repair remain.
          - Mandatory local refreshes remain **13:05, 13:20, 13:40, 23:59, 00:01**. Negative prices, Radius time bands, VAT once, DST and independent sites remain covered. Two-price-chart issue #10 stays out of scope.
          
          ## Validation and integrity
          
          - **234 producer tests per core**, HA **2026.10.3 / current 2026.10.4**, zero skips, 88% coverage. Two deprecation warnings originate in unchanged pinned HACS code.
          - Four unchanged consumer suites **153/176/227/228 cases per core**, plus two coupled startup/runtime cases per consumer/core. No CM code or controls changed.
          - Actual pinned HACS 2.0.5/upstream registration, beta discovery, install/update/uninstall/reinstall and authenticated channel repair/store restore. Official hassfest, translations, HACS metadata and independent native installation of both ZIP layouts outside source on both cores.
          - Real disposable HA 2026.10.4/frontend 20260930.5 desktop/mobile EN/DA: first run, each-step saving, interrupted resume, custom/public agreement, missing/provisional correction, explicit refresh, source outage/recovery and restart. Four beta.4 sites preserve configuration and historical decoded rows; nine-site restart preserves settled rows/revisions. Confirmed deletion removes only one 115-row site; same-name recreation has new ID and empty history. 19 screenshots and two short recordings. No final frontend errors; mobile width 390 without overflow.
          - Fictional test example: .100 spot + .200 grid + .111 supplier + .043 net + .072 system + .008 tax = .534 DKK ex VAT; ×1.25=**.6675 DKK / 66.75 øre including VAT**. Public Plus example assumes an explicitly confirmed fictional incl-VAT agreement, not inferred public VAT terms.
          - Exact source CI must pass before publication. Publisher verifies immutable annotated tag/source, all15 source checks, clean deterministic hashes, and both archive installations before upload. Public release/assets/source/HACS are independently checked afterward on both cores; final receipt is committed to PR #14.
          
          ```text
          9f8ea839a04b5d67f61dc0e49f11611abcb4c85cdfced809f813937548dc0ad0  ha_energy_price_engine.zip
          422c5d1bb39c4596a4af36db2e325ad56b642b8287e2bc09409d96a5928d3036  ha_energy_price_engine-manual.zip
          ```
          
          BUILD_MANIFEST identifies clean source/runtime payload; `published:false` means the builder itself never publishes. HACS installs the exact selected release tag. For manual placement extract the manual ZIP at HA's configuration root. The smaller root-layout ZIP belongs inside `custom_components/ha_energy_price_engine/`.
          
          ## Limits and remaining owner acceptance
          
          Radius automation supports confirmed Radius C. National baselines are bounded verified dated data, not live legislative discovery: Energinet .043/.072 DKK ex VAT during 2026, tax .008 during 2026–2027. Future periods/other products need verified rates; heating eligibility is never guessed. Historical household EWII .030 DKK ex VAT applies June–September 2026 only and is never a current or other-site default.
          
          Unsubmitted typing cannot survive closing a native HA form. Avoid simultaneous editing of one site. Forms follow the user's language; existing shared entities follow system/registry language. HACS's external brands catalog may show a fallback even while PE's native local icon works. Keep Show beta versions enabled; if HACS shows a hash, use its setting or PE's explicitly approved Advanced → Storage / site management → HACS beta channel repair.
          
          One-year concurrent cloud SQLite repeat: 35,136 rows / 18.24 MB, append 96 rows .0457s, reload 2.240s, lookup 10.06µs. **Cloud timings do not establish Raspberry Pi performance.** Immutable history stays in memory for API v1. Your source, bill, heating eligibility, physical mobile experience and hardware recovery/performance remain owner acceptance steps.
          
          No production HA, Node-RED, vehicles, chargers or CM were changed. No main merge or stable release. Development stops after beta.5 publication and independent verification.
          PE_NOTES
          if gh release view "$PE_TAG" >/dev/null 2>&1; then
            python - <<'PY_EXISTING'
          import json,os,subprocess
          data=json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/releases/tags/{os.environ["PE_TAG"]}']))
          assert data['prerelease'] and not data['draft'] and data['tag_name']==os.environ['PE_TAG']
          assets={a['name']:a for a in data['assets']}
          expected=json.load(open('dist/BUILD_MANIFEST.json'))['archives']
          assert set(assets)=={*expected,'BUILD_MANIFEST.json','SHA256SUMS'}
          for name,digest in expected.items():assert assets[name]['digest']=='sha256:'+digest
          print('Existing immutable beta.5 matches authorized hashes; no release/asset mutation')
          PY_EXISTING
          else
            gh release create "$PE_TAG" dist/ha_energy_price_engine.zip dist/ha_energy_price_engine-manual.zip dist/BUILD_MANIFEST.json dist/SHA256SUMS --prerelease --latest=false --verify-tag --title 'v0.1.0-beta.5 — simple setup with saved steps' --notes-file "$RUNNER_TEMP/pe-beta5-notes.md"
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$PE_TAG" --jq '{html_url,tag_name,draft,prerelease,assets:[.assets[].name]}'
  verify-public:
    name: Verify public beta.5 (${{ matrix.target }})
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ha-2026.10.3
            lockfile: requirements-dev.lock
          - target: ha-2026.10.4
            lockfile: requirements-ha-current.lock
    env:
      GH_TOKEN: ${{ github.token }}
      PE_SOURCE: a4ede923e42573def49026a8d1d817c37a979171
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v0.1.0-beta.5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.8'
      - uses: astral-sh/setup-uv@v6
      - name: Prepare independent hash-verified core and actual HACS references
        run: |
          set -euo pipefail
          uv venv
          uv pip sync --require-hashes ${{ matrix.lockfile }}
          uv run --no-project python tools/prepare_hacs_reference.py
      - name: Independently download public assets and test HACS and both native layouts
        run: |
          set -euo pipefail
          uv run --no-project python tools/verify_public_release.py --expected-commit "$PE_SOURCE" --output "$RUNNER_TEMP/public-beta5"
          uv run --no-project python - <<'PY_CHANNEL'
          import json,os,subprocess
          from pathlib import Path
          from custom_components.ha_energy_price_engine.update import release_for
          feed=json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/releases']))
          assert release_for(feed,'0.1.0-beta.4')['tag_name']=='v0.1.0-beta.5'
          assert release_for(feed,'0.1.0-beta.5')['tag_name']=='v0.1.0-beta.5'
          stable=release_for(feed,'0.1.0')
          assert stable is None or (not stable['prerelease'] and '-' not in stable['tag_name'])
          path=Path(os.environ['RUNNER_TEMP'])/'public-beta5/PUBLIC_RELEASE_RECEIPT.json'
          data=json.loads(path.read_text())
          data['public_release_channel_selection']={'beta4_to_beta5':True,'installed_beta5_stays_current':True,'stable_excludes_beta_and_hashes':True}
          path.write_text(json.dumps(data,indent=2)+'\n')
          print('Public semantic release channel selection passed')
          PY_CHANNEL
      - uses: actions/upload-artifact@v4
        with:
          name: pe-beta5-public-${{ matrix.target }}
          path: ${{ runner.temp }}/public-beta5/PUBLIC_RELEASE_RECEIPT.json
          if-no-files-found: error
  audit:
    name: Record verified beta.5 publication
    needs: [publish, verify-public]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PE_SOURCE: a4ede923e42573def49026a8d1d817c37a979171
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/beta5-simple-onboarding
      - uses: actions/download-artifact@v5
        with:
          pattern: pe-beta5-public-*
          path: public-verification
      - name: Record public verification and preserve main and prior tags
        run: |
          set -euo pipefail
          python - <<'PY_AUDIT'
          import json,os,subprocess,urllib.request
          from pathlib import Path
          from datetime import UTC,datetime
          repository=os.environ['GITHUB_REPOSITORY'];source=os.environ['PE_SOURCE'];tag='v0.1.0-beta.5'
          def api(path):return json.loads(subprocess.check_output(['gh','api',f'repos/{repository}/{path}']))
          receipts={p.parent.name:json.loads(p.read_text()) for p in Path('public-verification').rglob('PUBLIC_RELEASE_RECEIPT.json')}
          assert len(receipts)==2
          expected={'ha_energy_price_engine.zip':'9f8ea839a04b5d67f61dc0e49f11611abcb4c85cdfced809f813937548dc0ad0','ha_energy_price_engine-manual.zip':'422c5d1bb39c4596a4af36db2e325ad56b642b8287e2bc09409d96a5928d3036'}
          for receipt in receipts.values():
              assert receipt['source_commit']==source and receipt['archive_hashes']==expected
              assert receipt['isolated_hacs_and_native_install']=='passed'
              assert all(receipt['public_release_channel_selection'].values())
          release=api('releases/tags/'+tag)
          assert release['prerelease'] and not release['draft']
          assert api('commits/main')['sha']=='56cdb3c10993179371483812cbc36f651ba3ad8e'
          assert api('git/ref/tags/v0.1.0-beta.4')['object']['sha']=='90cb819f001fd390ca35e1c83f26d3c6303c4de1'
          assert api('git/ref/tags/v0.1.0-beta.3')['object']['sha']=='73b9e9e48d4cb17c69ecff4f77d9c992a5307516'
          tag_object=api('git/ref/tags/'+tag)['object']['sha'];assert tag_object=='7a919061010e1a018a54235e96711ff4295622a7'
          checks=api(f'commits/{source}/check-runs')['check_runs']
          assert len(checks)>=15 and all(c['conclusion']=='success' for c in checks)
          with urllib.request.urlopen(urllib.request.Request(release['html_url'],headers={'User-Agent':'PE-public-acceptance'}),timeout=30) as response:status=response.status
          assert status==200
          jobs=api(f'actions/runs/{os.environ["GITHUB_RUN_ID"]}/jobs')['jobs']
          completed=[j for j in jobs if j['name'].startswith(('publish','Verify public'))]
          assert len(completed)==3 and all(j['conclusion']=='success' for j in completed)
          report={'schema':1,'verified_at':datetime.now(UTC).isoformat(),'tag':tag,'source_commit':source,'tag_object':tag_object,'main_commit':'56cdb3c10993179371483812cbc36f651ba3ad8e','main_unmerged':True,'previous_releases_preserved':True,'release_url':release['html_url'],'release_id':release['id'],'draft':False,'prerelease':True,'unauthenticated_release_page_http':status,'archive_hashes':expected,'assets':[{k:a.get(k) for k in ('name','id','size','digest','browser_download_url')} for a in release['assets']],'publisher':{'id':int(os.environ['GITHUB_RUN_ID']),'html_url':f'https://github.com/{repository}/actions/runs/{os.environ["GITHUB_RUN_ID"]}','head_sha':os.environ['GITHUB_SHA'],'publication_and_both_verification_jobs':'success','workflow_final_conclusion':'pending audit completion'},'exact_source_checks':[{'name':c['name'],'id':c['id'],'conclusion':c['conclusion'],'url':c['html_url']} for c in checks],'validation':{'ha_cores':['2026.10.3','2026.10.4'],'producer_cases_per_core':234,'producer_coverage_percent':88,'skips':0,'warnings':'Two deprecation warnings in pinned upstream HACS code','unchanged_consumer_cases_per_core':{'pr15':153,'pr16':176,'pr25':227,'pr26':228},'actual_coupled_runtime_cases_per_consumer_per_core':2,'public_verification':'Fresh independent GitHub runner jobs on both locked cores; actual public metadata/assets/tag source/main plus unchanged pinned HACS2.0.5/upstream and both native ZIP layouts outside source','native_frontend':'Disposable HA2026.10.4/frontend20260930.5 EN/DA desktop/mobile; synthetic boundaries','simulation_receipt':'docs/receipts/v0.1.0-beta.5-simulation.json','public_release_channel_selection':'beta4 chooses beta5; installed beta5 current; stable excludes prereleases/hashes'},'public_verification_receipts':receipts,'owner_acceptance':False,'remaining_limitations':['Current private agreement and VAT basis require user confirmation; EWII suggestions are fresh public offers only.','National baselines are bounded dated data; other products/future periods require verified rules. Heating eligibility is never guessed.','New agreements start next complete quarter; first day may have only remaining-day coverage, never unknown past backfill.','Native Close cannot submit typed fields; avoid simultaneous edits of one site.','Entity names follow system/registry language; forms follow user language. HACS external brand catalog can show fallback.','Cloud SQLite measurements do not establish Raspberry Pi performance; history remains in memory for APIv1.'],'production_controls_touched':False}
          Path('docs/receipts/v0.1.0-beta.5.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          PY_AUDIT
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/receipts/v0.1.0-beta.5.json
          git commit -m 'docs: record independent public beta.5 verification on both cores'
          git push origin HEAD:refs/heads/feat/beta5-simple-onboarding
      - name: Update existing draft PR with verified prerelease
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/pe-beta5-pr.md" <<'PE_PR'
          Beta.5 is published and independently verified: https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/releases/tag/v0.1.0-beta.5

          Exact source **a4ede923e42573def49026a8d1d817c37a979171**; immutable annotated tag **7a919061010e1a018a54235e96711ff4295622a7**. Main and previous releases preserved; this PR stays draft/unmerged. Owner authorizes beta.5 prerelease only, not stable or production cutover.

          Five native stages save each accepted page immediately. Closing Configure resumes saved progress; review needs no final save. Current agreements need no ordinary dates, start next complete quarter and remain until changed without rewriting settled history/backfilling unknown quarters. Future dated/hour overrides are preserved. Fresh EWII offers require actual agreement/VAT confirmation; custom markup is ore/kWh and monthly fees stay separate. Numerical component checklist has direct corrections, one Check prices action and advanced diagnostics. Estimates never enter verified ledger/API READY. Beta.1–.4 IDs/mappings/history/APIv1 and safe reset are preserved.

          **Validation:** all15 exact-source push/PR/tag checks green;234 producer cases per HA2026.10.3/.4,88% coverage,zero skips; unchanged consumers153/176/227/228/core and2 coupled cases/reference/core. Official hassfest/HACS/translation/package gates passed. Fresh postpublication jobs independently downloaded public metadata/assets/source and exercised actual pinned HACS2.0.5/upstream registration/install/update/reinstall, both native archive layouts outside source, and actual semantic release selection on both cores.

          Real native EN/DA desktop/mobile journeys: first run, step saving/close/resume, custom/public offer, missing/provisional correction, outage/recovery, beta.4 migration, nine-site restart and selected115-row deletion/new empty identity.19 screenshots/two short demos; synthetic software evidence, not owner acceptance. Cloud SQLite measurements are not Pi results.

          [Illustrated guide and recordings](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/v0.1.0-beta.5/docs/WIZARD_GUIDE.md) · [HACS upgrade procedure](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/v0.1.0-beta.5/docs/HACS_DISTRIBUTION.md) · [Public receipt](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/feat/beta5-simple-onboarding/docs/receipts/v0.1.0-beta.5.json) · [Permanent handoff](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/feat/beta5-simple-onboarding/docs/DEVELOPMENT_STATUS.md)

          HACS: persist Show beta versions, refresh, choosev0.1.0-beta.5, download/restart; existing users Configure their current site. Verify your agreement/VAT/bill/providers and hardware/recovery. Native unsubmitted typing cannot be saved by closing. National defaults have bounded periods; future/other tariffs require verification; no heating eligibility guessed. HACS external catalog icon may fall back. Issue #10 remains out of scope.

          No production HA, Node-RED, CM, vehicles or charging controls changed. Development stops after public verification and final permanent handoff. Refs #8, #12.
          PE_PR
          gh api "repos/$GITHUB_REPOSITORY/pulls/14" --method PATCH -F body=@"$RUNNER_TEMP/pe-beta5-pr.md" --jq '{number,html_url,draft}'
