name: Publish authorized PE beta.9
on:
  push:
    branches: [feat/beta5-simple-onboarding]
    paths: [.github/workflows/publish-beta9.yml]
permissions:
  contents: write
  checks: read
  actions: read
  pull-requests: write
concurrency:
  group: publish-pe-v0.1.0-beta.9
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PE_SOURCE: 6c588323786cc5f8f696d553e02213ef8b169286
      PE_TAG: v0.1.0-beta.9
      PE_TAG_OBJECT: 4366f00efcacb3e858d6cf42a9623e691d371ba8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v0.1.0-beta.9
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.8'
      - uses: astral-sh/setup-uv@v6
      - name: Verify immutable authorized source and successful checks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PE_SOURCE"
          test "$(git rev-parse "$PE_TAG")" = "$PE_TAG_OBJECT"
          test "$(git cat-file -t "$PE_TAG")" = "tag"
          test "$(git rev-parse "$PE_TAG^{commit}")" = "$PE_SOURCE"
          python - <<'PY_CHECK'
          import json, os, subprocess, time
          sha=os.environ['PE_SOURCE']
          for attempt in range(30):
              result=json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/commits/{sha}/check-runs']))
              checks=result['check_runs']
              if len(checks)>=19 and all(c['status']=='completed' and c['conclusion']=='success' for c in checks):
                  break
              if any(c['status']=='completed' and c['conclusion'] not in ('success',) for c in checks):
                  raise SystemExit('Exact-source CI did not pass; publication prohibited')
              time.sleep(10)
          else:
              raise SystemExit('Exact-source CI is still pending; publication prohibited')
          from pathlib import Path
          repository=os.environ['GITHUB_REPOSITORY']
          def api(path):return json.loads(subprocess.check_output(['gh','api',f'repos/{repository}/{path}']))
          assert api('commits/main')['sha']=='56cdb3c10993179371483812cbc36f651ba3ad8e'
          pr=api('pulls/14');assert pr['state']=='open' and pr['draft'] and pr['head']['ref']=='feat/beta5-simple-onboarding'
          for number in range(1,9):
              prior=json.loads(Path(f'docs/receipts/v0.1.0-beta.{number}.json').read_text())
              tag=f'v0.1.0-beta.{number}';release=api('releases/tags/'+tag)
              assert release['id']==prior['release_id'] and release['prerelease'] and not release['draft']
              assert api('git/ref/tags/'+tag)['object']['sha']==prior.get('tag_object',prior.get('annotated_tag_object'))
              assets={a['name']:a for a in release['assets']}
              for name,digest in prior.get('archive_hashes',prior.get('archive_sha256')).items():assert assets[name]['digest']=='sha256:'+digest
          PY_CHECK
      - name: Build clean source and independently install both layouts
        run: |
          set -euo pipefail
          uv venv
          uv pip sync --require-hashes requirements-ha-current.lock
          uv run --no-project python tools/build_beta.py
          python - <<'PY_INTEGRITY'
          import hashlib,json,os
          from pathlib import Path
          manifest=json.loads(Path('dist/BUILD_MANIFEST.json').read_text())
          assert manifest['commit']==os.environ['PE_SOURCE'] and not manifest['dirty']
          expected={'ha_energy_price_engine.zip':'b95058c3a25fc393ee9052b4d9daf83af2da2487858e7522b8138d9fd5c87c31', 'ha_energy_price_engine-manual.zip':'58d0679d98925eb846ee1d1e189aff5ff0ff49f88a724550d93eb6a88fcfa6bc'}
          assert manifest['archives']==expected
          for name,digest in expected.items():
              assert hashlib.sha256((Path('dist')/name).read_bytes()).hexdigest()==digest
          PY_INTEGRITY
          uv run --no-project python tools/smoke_install_package.py dist/ha_energy_price_engine.zip
          uv run --no-project python tools/smoke_install_package.py dist/ha_energy_price_engine-manual.zip
      - name: Publish authorized immutable beta.9 only
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/pe-beta9-notes.md" <<'PE_NOTES'
          Beta.9 fixes the remaining beta.8 setup and device-diagnostic usability issues from #8 and #10. **Done – return to integration** explicitly finishes already-saved native Options. Current Unknown values now have actionable availability explanations, and the device shows eight actual stored price components.

          **HACS prerelease for development Home Assistant acceptance.** Exact immutable source **6c588323786cc5f8f696d553e02213ef8b169286**; tag **v0.1.0-beta.9**. [PR #14](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/pull/14) remains draft/unmerged. Main and beta.1–.8 releases/tags/assets preserved. No stable/production/control changes.

          ## Update with HACS

          1. Back up development HA. Open Energy Price Engine in HACS, persist **Show beta versions**, refresh information and select **v0.1.0-beta.9**. Download, restart HA and reload the app/browser; Device info must show **0.1.0-beta.9**. Keep existing entries.
          2. Open **Configure**. Use **Done – return to integration**, row-level editing or **Check prices**. Accepted steps are already saved. The initial installation flow uses HA’s native settings-saved completion notice; it does not create another site.
          3. On the device, inspect **Component period**, the eight component amounts, **Prices now — availability**, **Today statistics — availability**, **Tomorrow prices — availability** and the exact **Verified prices begin** time.
          4. New installs default technical duplicates and unused provisional sensors off. Upgrades preserve enabled entity choices. Optionally use **Configure → Technical diagnostics** to deselect only unused canonical rows; keep any used by automations or Recorder. IDs/history stay, disabled entities stop new sensor samples, and the CM API continues independently.
          5. The beta.8 dashboard remains supported. If using it, change the registered local JavaScript resource query to `?v=0.1.0-beta.9` and reload. Both graphs, complete tables and today’s DSO ranges remain. [Setup guide](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/v0.1.0-beta.9/docs/WIZARD_GUIDE.md) · [HACS procedure](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/v0.1.0-beta.9/docs/HACS_DISTRIBUTION.md) · [Acceptance checklist](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/feat/beta5-simple-onboarding/docs/BETA_ACCEPTANCE.md).

          ## Understand the component amounts and Unknown

          Device diagnostics show **Nord Pool spot, Radius/DSO, Energinet network, Energinet system, supplier markup and electricity tax excluding VAT; applied VAT amount; verified final marginal price including VAT once**. Fixed **øre/kWh, two decimals**, independent of the main display preference. Amounts, source, effective metadata and revision come from actual stored verified records. The applied VAT amount is the sum recorded for each component; mixed VAT bases/negative values are retained. Rounded rows can differ by0.01 from a rounded total. Fixed subscriptions remain excluded.

          **Component period** explicitly identifies the current verified quarter or **Next quarter — current quarter unavailable**. When first prices begin next quarter, Final now correctly stays Unknown; availability explains the activation boundary and shows the exact start time. At that boundary, current pricing/period update automatically. Full-day statistics remain unavailable when earlier quarters are missing; a complete verified future CM window can still be Ready. Separate guidance distinguishes loading, tomorrow publication, missing tariffs/contracts, stale verification and genuine source/storage errors. No unverified past backfill, fabricated zeros or weaker readiness.

          Ordinary statuses use localized **Ready / Incomplete / Stale / Error**. Existing advanced canonical uppercase states, DKK/kWh, entity IDs, Recorder units and CM APIv1 remain unchanged. All9 engine/source/SQLite/coordinator/scheduler/component-math/API files are byte-identical published beta.8. Required13:05/13:20/13:40/23:59/00:01 refreshes retained. Historical EWII0.030DKKexVAT remains June–September2026 only; no future/private contract or heating guesses.

          ## Validation and integrity

          **333 producer tests/core** HA2026.10.3/current2026.10.4, **89% coverage**, zero skips; two unchanged upstream HACS deprecation warnings. Unchanged CM suites **153/176/227/228/core**, plus2 coupled runtime cases/reference/core. **17 locked browser regressions**, Ruff, official hassfest1valid/0invalid, HACS/translations and both clean native ZIP layouts outside source. All19 exact-source push/PR/tag/draft checks must pass before upload.

          Native HA.4/frontend20260930.5, desktop1440x1000/mobile390x844 EN/DA passes Done/close/reopen, eight numerical components/VAT/source, exact activation, user preferences and preserved dashboard graphs/tables/revisions. A fresh first-activation run observed the **actual unpatched20:00CET clock boundary**: Unknown/currentIncomplete→Ready/current equals exact priorNext, component scope next→current, historyIncomplete/tomorrowReady, no backfill. All8 native amounts/source/revision match exact SQLite snapshots. Upgrade preserves6configs/168original IDs/4logical ledgers; restart preserves7configs/287IDs/5ledgers while adding an eighth QA site. All14 original Recorder unit identities retained. Provider counters unchanged on reads; zero browser errors/warnings. **27 actual screenshot hashes/data** in the [simulation receipt](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/v0.1.0-beta.9/docs/receipts/v0.1.0-beta.9-simulation.json). Synthetic/recorded software evidence, **not owner real-HA acceptance**.

          Two fresh post-publication jobs independently verify public metadata/tag/main/assets, actual pinned HACS2.0.5/upstream registration/beta8→9 installation/update/uninstall/reinstall and both native ZIP layouts on both cores. Original public beta8 ZIP is downloaded/hash-verified first; real SQLite history survives HACS operations. Beta8 selects9, current9 stays current and stable excludes prereleases/hashes. Their results are committed to the [public verification receipt](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/feat/beta5-simple-onboarding/docs/receipts/v0.1.0-beta.9.json) after both complete.

          SHA256:
          - HACS ZIP: `b95058c3a25fc393ee9052b4d9daf83af2da2487858e7522b8138d9fd5c87c31`
          - Manual ZIP: `58d0679d98925eb846ee1d1e189aff5ff0ff49f88a724550d93eb6a88fcfa6bc`
          - Download `BUILD_MANIFEST.json` and `SHA256SUMS` for exact source/member checks.

          ## Remaining limits

          Existing enabled canonical diagnostics are preserved intentionally: cleaning an existing device is an explicit user selection. HA can truncate long status/name rows; open the entity for complete details. Initial native installation ends with HA’s supported settings-saved notice; Options Done returns directly to the integration. Unsubmitted form typing is not durable until the native form is submitted. All-in sources cannot reveal unknown component splits. User precision overrides remain user-owned. Dashboard requires its one-time local Resource registration and covers today/tomorrow.

          Private contract/VAT/grid/heating values, live provider availability and physical mobile/hardware acceptance remain owner checks. Public national rates are bounded; no future EWII inference. **Cloud benchmarks do not establish Raspberry Pi performance**; original SQLite improvement and historical API retained. HACS external branding can fall back.

          No production HA, Node-RED, Tesla/Easee, CM source or charging commands touched. No stable release or main merge. Stop after beta.9 publication and independent verification.
          PE_NOTES
          if gh release view "$PE_TAG" >/dev/null 2>&1; then
            python - <<'PY_EXISTING'
          import json,os,subprocess
          data=json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/releases/tags/{os.environ["PE_TAG"]}']))
          assert data['prerelease'] and not data['draft'] and data['tag_name']==os.environ['PE_TAG']
          assets={a['name']:a for a in data['assets']}
          expected=json.load(open('dist/BUILD_MANIFEST.json'))['archives']
          assert set(assets)=={*expected,'BUILD_MANIFEST.json','SHA256SUMS'}
          for name,digest in expected.items():assert assets[name]['digest']=='sha256:'+digest
          print('Existing immutable beta.9 matches authorized hashes; no release/asset mutation')
          PY_EXISTING
          else
            gh release create "$PE_TAG" --target "$PE_SOURCE" dist/ha_energy_price_engine.zip dist/ha_energy_price_engine-manual.zip dist/BUILD_MANIFEST.json dist/SHA256SUMS --prerelease --latest=false --verify-tag --title 'v0.1.0-beta.9 — finish setup and inspect verified price components' --notes-file "$RUNNER_TEMP/pe-beta9-notes.md"
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$PE_TAG" --jq '{html_url,tag_name,draft,prerelease,assets:[.assets[].name]}'
  verify-public:
    name: Verify public beta.9 (${{ matrix.target }})
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ha-2026.10.3
            lockfile: requirements-dev.lock
          - target: ha-2026.10.4
            lockfile: requirements-ha-current.lock
    env:
      GH_TOKEN: ${{ github.token }}
      PE_SOURCE: 6c588323786cc5f8f696d553e02213ef8b169286
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v0.1.0-beta.9
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.8'
      - uses: astral-sh/setup-uv@v6
      - name: Prepare independent hash-verified core and actual HACS references
        run: |
          set -euo pipefail
          uv venv
          uv pip sync --require-hashes ${{ matrix.lockfile }}
          uv run --no-project python tools/prepare_hacs_reference.py
      - name: Independently download public assets and test HACS and both native layouts
        run: |
          set -euo pipefail
          uv run --no-project python tools/verify_public_release.py --expected-commit "$PE_SOURCE" --output "$RUNNER_TEMP/public-beta9"
          uv run --no-project python - <<'PY_CHANNEL'
          import json,os,subprocess
          from pathlib import Path
          from custom_components.ha_energy_price_engine.update import release_for
          feed=json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/releases']))
          assert release_for(feed,'0.1.0-beta.8')['tag_name']=='v0.1.0-beta.9'
          assert release_for(feed,'0.1.0-beta.9')['tag_name']=='v0.1.0-beta.9'
          stable=release_for(feed,'0.1.0')
          assert stable is None or (not stable['prerelease'] and '-' not in stable['tag_name'])
          path=Path(os.environ['RUNNER_TEMP'])/'public-beta9/PUBLIC_RELEASE_RECEIPT.json'
          data=json.loads(path.read_text())
          data['public_release_channel_selection']={'beta8_to_beta9':True,'installed_beta9_stays_current':True,'stable_excludes_beta_and_hashes':True}
          path.write_text(json.dumps(data,indent=2)+'\n')
          print('Public semantic release channel selection passed')
          PY_CHANNEL
      - uses: actions/upload-artifact@v4
        with:
          name: pe-beta9-public-${{ matrix.target }}
          path: ${{ runner.temp }}/public-beta9/PUBLIC_RELEASE_RECEIPT.json
          if-no-files-found: error
  audit:
    name: Record verified beta.9 publication
    needs: [publish, verify-public]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PE_SOURCE: 6c588323786cc5f8f696d553e02213ef8b169286
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/beta5-simple-onboarding
      - uses: actions/download-artifact@v5
        with:
          pattern: pe-beta9-public-*
          path: public-verification
      - name: Record public verification and preserve main and prior tags
        run: |
          set -euo pipefail
          python - <<'PY_AUDIT'
          import json,os,subprocess,urllib.request
          from pathlib import Path
          from datetime import UTC,datetime
          repository=os.environ['GITHUB_REPOSITORY'];source=os.environ['PE_SOURCE'];tag='v0.1.0-beta.9'
          def api(path):return json.loads(subprocess.check_output(['gh','api',f'repos/{repository}/{path}']))
          receipts={p.parent.name:json.loads(p.read_text()) for p in Path('public-verification').rglob('PUBLIC_RELEASE_RECEIPT.json')}
          assert len(receipts)==2
          expected={'ha_energy_price_engine.zip':'b95058c3a25fc393ee9052b4d9daf83af2da2487858e7522b8138d9fd5c87c31','ha_energy_price_engine-manual.zip':'58d0679d98925eb846ee1d1e189aff5ff0ff49f88a724550d93eb6a88fcfa6bc'}
          for receipt in receipts.values():
              assert receipt['source_commit']==source and receipt['archive_hashes']==expected
              assert receipt['isolated_hacs_and_native_install']=='passed'
              assert all(receipt['public_release_channel_selection'].values())
          release=api('releases/tags/'+tag)
          assert release['prerelease'] and not release['draft']
          assert api('commits/main')['sha']=='56cdb3c10993179371483812cbc36f651ba3ad8e'
          assert api('git/ref/tags/v0.1.0-beta.4')['object']['sha']=='90cb819f001fd390ca35e1c83f26d3c6303c4de1'
          assert api('git/ref/tags/v0.1.0-beta.3')['object']['sha']=='73b9e9e48d4cb17c69ecff4f77d9c992a5307516'
          prior=[]
          for number in range(1,9):
              previous=json.loads(Path(f'docs/receipts/v0.1.0-beta.{number}.json').read_text())
              oldtag=f'v0.1.0-beta.{number}'; old=api('releases/tags/'+oldtag)
              assert old['id']==previous['release_id'] and old['prerelease'] and not old['draft']
              assert api('git/ref/tags/'+oldtag)['object']['sha']==previous.get('tag_object',previous.get('annotated_tag_object'))
              assets={a['name']:a for a in old['assets']}
              for name,digest in previous.get('archive_hashes',previous.get('archive_sha256')).items():
                  assert assets[name]['digest']=='sha256:'+digest
              for asset in previous.get('assets',[]):
                  assert all(assets[asset['name']].get(k)==asset[k] for k in ('id','size','digest') if k in asset)
              prior.append({'tag':oldtag,'release_id':old['id'],'tag_and_asset_integrity_preserved':True})
          tag_object=api('git/ref/tags/'+tag)['object']['sha'];assert tag_object=='4366f00efcacb3e858d6cf42a9623e691d371ba8'
          checks=api(f'commits/{source}/check-runs')['check_runs']
          assert len(checks)>=19 and all(c['conclusion']=='success' for c in checks)
          with urllib.request.urlopen(urllib.request.Request(release['html_url'],headers={'User-Agent':'PE-public-acceptance'}),timeout=30) as response:status=response.status
          assert status==200
          jobs=api(f'actions/runs/{os.environ["GITHUB_RUN_ID"]}/jobs')['jobs']
          completed=[j for j in jobs if j['name'].startswith(('publish','Verify public'))]
          assert len(completed)==3 and all(j['conclusion']=='success' for j in completed)
          report={'schema':1,'verified_at':datetime.now(UTC).isoformat(),'tag':tag,'source_commit':source,'tag_object':tag_object,'main_commit':'56cdb3c10993179371483812cbc36f651ba3ad8e','main_unmerged':True,'previous_releases_preserved':True,'prior_releases':prior,'release_url':release['html_url'],'release_id':release['id'],'draft':False,'prerelease':True,'unauthenticated_release_page_http':status,'archive_hashes':expected,'assets':[{k:a.get(k) for k in ('name','id','size','digest','browser_download_url')} for a in release['assets']],'publisher':{'id':int(os.environ['GITHUB_RUN_ID']),'html_url':f'https://github.com/{repository}/actions/runs/{os.environ["GITHUB_RUN_ID"]}','head_sha':os.environ['GITHUB_SHA'],'publication_and_both_verification_jobs':'success','workflow_final_conclusion':'pending audit completion'},'exact_source_checks':[{'name':c['name'],'id':c['id'],'conclusion':c['conclusion'],'url':c['html_url']} for c in checks],'validation':{'ha_cores':['2026.10.3','2026.10.4'],'producer_cases_per_core':333,'producer_coverage_percent':89,'browser_regressions':17,'native_dashboard_rows':192,'native_today_tariff_ranges':4,'skips':0,'warnings':'Two deprecation warnings in pinned upstream HACS code','unchanged_consumer_cases_per_core':{'pr15':153,'pr16':176,'pr25':227,'pr26':228},'actual_coupled_runtime_cases_per_consumer_per_core':2,'public_verification':'Fresh independent GitHub runner jobs on both locked cores; actual public metadata/assets/tag source/main plus unchanged pinned HACS2.0.5/upstream and both native ZIP layouts outside source','native_frontend':'Disposable HA2026.10.4/frontend20260930.5 EN/en-GB/DA desktop/mobile; synthetic boundaries','simulation_receipt':'docs/receipts/v0.1.0-beta.9-simulation.json','public_release_channel_selection':'beta8 chooses beta9; installed beta9 current; stable excludes prereleases/hashes'},'public_verification_receipts':receipts,'owner_acceptance':False,'remaining_limitations':['Existing enabled canonical diagnostics are preserved; cleanup is an explicit native user choice.', 'Native initial setup uses the settings-saved notice; Options Done returns directly to integration.', 'HA can truncate long device rows; open entity for complete details.', 'Register the bundled module once in HA Resources; dedicated dashboard only today/tomorrow.', 'Missing final ledger records cannot prove applied component/DSO values; all-in inputs cannot expose unknown split.', 'Canonical CM API DKK precision/machine states preserved; primary status display uses supported localized presentation enums.', 'Actual private contract/VAT/grid/heating, provider availability and physical hardware remain owner acceptance. National baselines are bounded, no future EWII inference.', 'Cloud benchmarks do not establish Raspberry Pi performance; original SQLite improvement and synchronous history-in-memory API retained.', 'HACS external brand catalog can show a fallback.'],'production_controls_touched':False}
          Path('docs/receipts/v0.1.0-beta.9.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          PY_AUDIT
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/receipts/v0.1.0-beta.9.json
          git commit -m 'docs: record independent public beta.9 verification on both cores'
          git push origin HEAD:refs/heads/feat/beta5-simple-onboarding
      - name: Update existing draft PR with verified prerelease
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/pe-beta9-pr.md" <<'PE_PR'
          Beta.9 is published and independently verified: https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/releases/tag/v0.1.0-beta.9

          Exact source **6c588323786cc5f8f696d553e02213ef8b169286**, immutable annotated tag v0.1.0-beta.9. Existing PR remains draft/unmerged; main and beta.1–.8 tags/assets preserved. Resolves owner beta.8 usability gaps on #8/#10, preserving pricing/SQLite/source adapters and CM APIv1.

          Visible supported native Done closes already-saved Options to integration; initial ConfigFlow uses settings-saved completion. Eight readable ore/kWh2 device component amounts use actual verified stored snapshots, applied VAT sum, full source/period/revision and explicit current/next scope. Availability explains expected Unknown at activation, publication, historical gaps and actual component/source/storage/stale failures. Exact first-pricing time and ordinary Title Case statuses. Numeric unknown/strict verified readiness retained; no read fetch, SQL or recomposition.

          New technical duplicates/unused provisional default off. Migrated user-enabled entities/IDs/names/hides/disables/Recorder units preserved. Configure → Technical diagnostics is an explicit checkbox selection for existing-site cleanup.9 core engine/source/API/SQLite/math/schedule files byte-identical beta8; all prior graphs/tables/tariffs/revisions and refresh/contract boundaries retained.

          Validation:333 producer tests/core HA2026.10.3/current.4,89%coverage,zero skips;unchanged CM153/176/227/228/core plus2coupled/ref/core;17 locked browser regressions;hassfest/HACS/Ruff/translations and both installed ZIP layouts. Native HA.4 desktop/mobile EN/DA has zero browser errors/warnings, eight amounts/source/revision matching SQLite, provider counters unchanged on reads. Actual unpatched20:00CET boundary observed Unknown/currentIncomplete→Ready/priorNext exact, explicit next→current components, historyIncomplete/tomorrowReady/no backfill. Upgrade preserves6configs/168IDs/4ledgers;restart preserves7configs/287IDs/5ledgers while adding eighth QA site;14Recorder unit identities retained.27 actual screenshot hashes/data in simulation receipt. Synthetic/recorded QA, not owner HA acceptance.

          All19 exact-source checks passed. Two independent public jobs verify downloaded metadata/tag/main/assets, actual pinned HACS2.0.5/upstream beta8→9 and current9 install/update/uninstall/reinstall with real SQLite preservation, both native ZIPs on both cores, semantic beta/stable channels and all earlier tags/assets. No immutable asset overwrite.

          [Setup](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/v0.1.0-beta.9/docs/WIZARD_GUIDE.md) · [HACS](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/v0.1.0-beta.9/docs/HACS_DISTRIBUTION.md) · [Native screenshot/data proof](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/v0.1.0-beta.9/docs/receipts/v0.1.0-beta.9-simulation.json) · [Public verification](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/feat/beta5-simple-onboarding/docs/receipts/v0.1.0-beta.9.json) · [Handoff](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/feat/beta5-simple-onboarding/docs/DEVELOPMENT_STATUS.md).

          HACS:persist Show beta versions,refresh,select9,download/restart/reload. Keep existing sites. Optional explicit technical cleanup retains used entities. Resource queryv9 for existing dashboard. Limits:native row truncation/initial saved notice/unsubmitted form typing, preserved advanced machine states, two-day dashboard, all-in split availability, actual private/provider/hardware acceptance; cloud benchmarks not Pi results. No production HA/Node-RED/CM/physical controls, stable or main merge. Stop after verified9.
          PE_PR
          gh api "repos/$GITHUB_REPOSITORY/pulls/14" --method PATCH --raw-field title='Beta.8: stored quarter-hour price dashboard, tariffs and components' -F body=@"$RUNNER_TEMP/pe-beta9-pr.md" --jq '{number,html_url,draft}'
