name: Publish authorized PE beta.10
on:
  push:
    branches: [feat/beta5-simple-onboarding]
    paths: [.github/workflows/publish-beta10.yml]
permissions:
  contents: write
  checks: read
  actions: read
  pull-requests: write
concurrency:
  group: publish-pe-v0.1.0-beta.10
  cancel-in-progress: false
env:
  PE_SOURCE: 150c24fa08988b6ae308dec68bb21016ffcca0b9
  PE_TAG: v0.1.0-beta.10
  PE_TAG_OBJECT: 3a0f9ae43212857e765cdc1fda05e0e25f2d4fda
  PE_HACS_SHA: 899ee061423092260258e22b248f0fecbe80322f9bfb3c4d4d3ac5ece3529df5
  PE_MANUAL_SHA: d8c298e38a2c9fea0e7972ce60c2291be492c59986f3eea854cb01b011c6f0e4
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v0.1.0-beta.10
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.8'
      - uses: astral-sh/setup-uv@v6
      - name: Guard exact source, CI, immutable tag, main and prior releases
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PE_SOURCE"
          test "$(git cat-file -t "$PE_TAG")" = tag
          test "$(git rev-parse "$PE_TAG")" = "$PE_TAG_OBJECT"
          test "$(git rev-parse "$PE_TAG^{commit}")" = "$PE_SOURCE"
          python - <<'PY'
          import json,os,subprocess,time
          from collections import Counter
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY'];source=os.environ['PE_SOURCE']
          def api(path):return json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/{path}']))
          required={'hassfest','hacs','independent beta install','tests (fixture-supported-ha-2026.10.3)','tests (current-ha-2026.10.4)','dashboard browser desktop and mobile'}
          for attempt in range(30):
              checks=api(f'commits/{source}/check-runs?per_page=100')['check_runs']
              if any(c['status']=='completed' and c['conclusion']!='success' for c in checks):raise SystemExit('Exact-source CI failed; no publication')
              counts=Counter(c['name'] for c in checks if c['status']=='completed' and c['conclusion']=='success')
              if len(checks)>=18 and all(counts[name]>=3 for name in required) and all(c['status']=='completed' and c['conclusion']=='success' for c in checks):break
              time.sleep(10)
          else:raise SystemExit('Exact-source push/PR/tag CI pending; no publication')
          assert api('commits/main')['sha']=='56cdb3c10993179371483812cbc36f651ba3ad8e'
          pr=api('pulls/14');assert pr['state']=='open' and pr['draft'] and pr['head']['ref']=='feat/beta5-simple-onboarding'
          assert json.loads(Path('custom_components/ha_energy_price_engine/manifest.json').read_text())['version']=='0.1.0-beta.10'
          for number in range(1,10):
              tag=f'v0.1.0-beta.{number}';prior=json.loads(Path(f'docs/receipts/{tag}.json').read_text());release=api('releases/tags/'+tag)
              assert release['id']==prior['release_id'] and release['prerelease'] and not release['draft']
              assert api('git/ref/tags/'+tag)['object']['sha']==prior.get('tag_object',prior.get('annotated_tag_object'))
              assets={a['name']:a for a in release['assets']}
              for name,digest in prior.get('archive_hashes',prior.get('archive_sha256')).items():assert assets[name]['digest']=='sha256:'+digest
              for asset in prior.get('assets',[]):
                  assert all(assets[asset['name']].get(k)==asset[k] for k in ('id','size','digest') if k in asset)
          PY
      - name: Rebuild and independently install both immutable layouts
        run: |
          set -euo pipefail
          uv venv
          uv pip sync --require-hashes requirements-ha-current.lock
          uv run --no-project python tools/build_beta.py
          python - <<'PY'
          import json,os,hashlib,re
          from pathlib import Path
          m=json.loads(Path('dist/BUILD_MANIFEST.json').read_text())
          expected={'ha_energy_price_engine.zip':os.environ['PE_HACS_SHA'],'ha_energy_price_engine-manual.zip':os.environ['PE_MANUAL_SHA']}
          assert m['commit']==os.environ['PE_SOURCE'] and not m['dirty'] and m['archives']==expected
          for name,digest in expected.items():assert hashlib.sha256((Path('dist')/name).read_bytes()).hexdigest()==digest
          notes=Path('docs/RELEASE_BETA10.md').read_text()
          base=f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/blob/{os.environ["PE_TAG"]}/docs/'
          notes=re.sub(r'\]\((?!https?://)([^)]+)\)',lambda m:']('+base+m[1]+')',notes)
          notes+='\n\nExact source: `'+os.environ['PE_SOURCE']+'`. Annotated tag: `'+os.environ['PE_TAG']+'` (`'+os.environ['PE_TAG_OBJECT']+'`).\n\n```text\n'+Path('dist/SHA256SUMS').read_text()+'```\n'
          (Path(os.environ['RUNNER_TEMP'])/'beta10-notes.md').write_text(notes)
          PY
          uv run --no-project python tools/smoke_install_package.py dist/ha_energy_price_engine.zip
          uv run --no-project python tools/smoke_install_package.py dist/ha_energy_price_engine-manual.zip
      - name: Publish authorized beta10 prerelease without replacing assets
        run: |
          set -euo pipefail
          if gh release view "$PE_TAG" >/dev/null 2>&1; then
            python - <<'PY'
          import json,os,subprocess
          r=json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/releases/tags/{os.environ["PE_TAG"]}']))
          assert r['prerelease'] and not r['draft'] and r['tag_name']==os.environ['PE_TAG']
          assets={a['name']:a for a in r['assets']};m=json.load(open('dist/BUILD_MANIFEST.json'))
          assert set(assets)=={*m['archives'],'BUILD_MANIFEST.json','SHA256SUMS'}
          for name,digest in m['archives'].items():assert assets[name]['digest']=='sha256:'+digest
          print('Existing immutable beta10 matches; no release or asset mutation')
          PY
          else
            gh release create "$PE_TAG" --target "$PE_SOURCE" dist/ha_energy_price_engine.zip dist/ha_energy_price_engine-manual.zip dist/BUILD_MANIFEST.json dist/SHA256SUMS --prerelease --latest=false --verify-tag --title 'v0.1.0-beta.10 — minimal electricity price engine (breaking beta)' --notes-file "$RUNNER_TEMP/beta10-notes.md"
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$PE_TAG" --jq '{html_url,tag_name,draft,prerelease,assets:[.assets[].name]}'
  verify-public:
    name: Verify public beta.10 (${{ matrix.target }})
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ha-2026.10.3
            lockfile: requirements-dev.lock
          - target: ha-2026.10.4
            lockfile: requirements-ha-current.lock
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v0.1.0-beta.10
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.8'
      - uses: astral-sh/setup-uv@v6
      - name: Prepare independent locked core and pinned actual HACS
        run: |
          uv venv
          uv pip sync --require-hashes ${{ matrix.lockfile }}
          uv run --no-project python tools/prepare_hacs_reference.py
      - name: Download and verify public source, assets and actual HACS/native installs
        run: uv run --no-project python tools/verify_public_release.py --expected-commit "$PE_SOURCE" --output "$RUNNER_TEMP/public-beta10"
      - uses: actions/upload-artifact@v4
        with:
          name: pe-beta10-public-${{ matrix.target }}
          path: ${{ runner.temp }}/public-beta10/PUBLIC_RELEASE_RECEIPT.json
          if-no-files-found: error
  audit:
    name: Record verified beta.10 publication
    needs: [publish, verify-public]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/beta5-simple-onboarding
      - uses: actions/download-artifact@v5
        with:
          pattern: pe-beta10-public-*
          path: public-verification
      - name: Record independent public verification and preserve prior releases
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess,urllib.request
          from pathlib import Path
          from datetime import UTC,datetime
          repo=os.environ['GITHUB_REPOSITORY'];source=os.environ['PE_SOURCE'];tag=os.environ['PE_TAG']
          def api(path):return json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/{path}']))
          receipts={p.parent.name:json.loads(p.read_text()) for p in Path('public-verification').rglob('PUBLIC_RELEASE_RECEIPT.json')}
          expected={'ha_energy_price_engine.zip':os.environ['PE_HACS_SHA'],'ha_energy_price_engine-manual.zip':os.environ['PE_MANUAL_SHA']}
          assert len(receipts)==2
          for receipt in receipts.values():
              assert receipt['source_commit']==source and receipt['archive_hashes']==expected and receipt['isolated_hacs_and_native_install']=='passed'
          assert api('commits/main')['sha']=='56cdb3c10993179371483812cbc36f651ba3ad8e'
          prior=[]
          for number in range(1,10):
              oldtag=f'v0.1.0-beta.{number}';previous=json.loads(Path(f'docs/receipts/{oldtag}.json').read_text());r=api('releases/tags/'+oldtag)
              assert r['id']==previous['release_id'] and r['prerelease'] and not r['draft']
              assert api('git/ref/tags/'+oldtag)['object']['sha']==previous.get('tag_object',previous.get('annotated_tag_object'))
              assets={a['name']:a for a in r['assets']}
              for name,digest in previous.get('archive_hashes',previous.get('archive_sha256')).items():assert assets[name]['digest']=='sha256:'+digest
              for asset in previous.get('assets',[]):assert all(assets[asset['name']].get(k)==asset[k] for k in ('id','size','digest') if k in asset)
              prior.append({'tag':oldtag,'release_id':r['id'],'tag_and_asset_integrity_preserved':True})
          release=api('releases/tags/'+tag);assert release['prerelease'] and not release['draft']
          tag_object=api('git/ref/tags/'+tag)['object']['sha'];assert tag_object==os.environ['PE_TAG_OBJECT']
          checks=api(f'commits/{source}/check-runs?per_page=100')['check_runs'];assert len(checks)>=18 and all(c['conclusion']=='success' for c in checks)
          jobs=api(f'actions/runs/{os.environ["GITHUB_RUN_ID"]}/jobs')['jobs'];done=[j for j in jobs if j['name'].startswith(('publish','Verify public'))]
          assert len(done)==3 and all(j['conclusion']=='success' for j in done)
          with urllib.request.urlopen(urllib.request.Request(release['html_url'],headers={'User-Agent':'PE-beta10-public-verification'}),timeout=30) as response:status=response.status
          assert status==200
          report={'schema':1,'verified_at':datetime.now(UTC).isoformat(),'tag':tag,'source_commit':source,'tag_object':tag_object,'main_commit':'56cdb3c10993179371483812cbc36f651ba3ad8e','main_unmerged':True,'previous_releases_preserved':True,'prior_releases':prior,'release_url':release['html_url'],'release_id':release['id'],'draft':False,'prerelease':True,'unauthenticated_release_page_http':status,'archive_hashes':expected,'assets':[{k:a.get(k) for k in ('name','id','size','digest','browser_download_url')} for a in release['assets']],'publisher':{'id':int(os.environ['GITHUB_RUN_ID']),'html_url':f'https://github.com/{repo}/actions/runs/{os.environ["GITHUB_RUN_ID"]}','head_sha':os.environ['GITHUB_SHA'],'publication_and_both_verification_jobs':'success','workflow_final_conclusion':'pending audit completion'},'exact_source_checks':[{'name':c['name'],'id':c['id'],'conclusion':c['conclusion'],'url':c['html_url']} for c in checks],'validation':{'ha_cores':['2026.10.3','2026.10.4'],'producer_cases_per_core':112,'producer_coverage_percent':90,'browser_regressions':18,'native_screenshots':21,'skips':0,'warnings':'Two deprecations in pinned upstream HACS code','public_verification':'Fresh jobs on both locked cores independently download metadata/source/main/assets and the original beta9 HACS ZIP; test actual pinned HACS2.0.5/upstream add/beta visibility/update/reinstall/uninstall and both native ZIP layouts outside source','simulation_receipt':'docs/receipts/v0.1.0-beta.10-simulation.json'},'public_verification_receipts':receipts,'owner_acceptance':False,'remaining_limitations':['Unchanged CM API1 adapter is incompatible; precise API2 source-change handoff supplied, CM source unchanged.','Old beta sites require explicit backup/reset/recreation with new IDs; no silent migration/deletion.','Actual private rates, provider availability and hardware acceptance remain owner checks.','All history remains indexed in memory; cloud benchmarks do not establish Raspberry Pi performance.','Bundled card requires one resource registration and covers today/tomorrow.'],'production_controls_touched':False}
          Path('docs/receipts/v0.1.0-beta.10.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/receipts/v0.1.0-beta.10.json
          git commit -m 'docs: record independent public beta10 verification on both cores'
          git push origin HEAD:refs/heads/feat/beta5-simple-onboarding
      - name: Update existing draft PR with the verified breaking prerelease
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/beta10-pr-final.md" <<'MD'
          Published and independently verified **v0.1.0-beta.10**: https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/releases/tag/v0.1.0-beta.10

          Exact immutable source **150c24fa08988b6ae308dec68bb21016ffcca0b9**. Breaking MVP cleanup for #15, related #8/#10: nine sensors replace 40+1 entities; one dated marginal-pricing path, saved source/grid/supplier setup, immediate full-day or labeled remaining-day statistics, one bundled auto-discovered card and immutable read-only API v2. Fifteen runtime modules and invoice/subscription/provisional/legacy paths removed. Proven compressed SQLite ledger retained unchanged; 55% fewer runtime Python lines.

          Older beta sites require explicit backup/reset/recreation. API v1 is removed. CM source is unchanged and requires the [precise API2 handoff](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/v0.1.0-beta.10/docs/INTEROPERABILITY.md); no unchanged-CM compatibility claim.

          Validation: 112 tests per supported/current HA core, 90% coverage, zero skips; 18 locked desktop/mobile browser cases; official hassfest/HACS; actual HACS2.0.5/upstream beta9 file upgrade, reinstall and uninstall; both ZIP layouts configured/reloaded outside source. Twenty-one actual native HA.4 EN/DA screenshots cover nine entities, saved/invalid input, full/remaining-day statistics, multiple sites and selected-site reset. Restart preserves two ledger files byte-identically; reset preserves the other site. No provider requests on reads or browser errors/warnings. Cloud benchmarks are not Raspberry Pi performance evidence.

          All exact-source push/PR/tag checks passed before publication. Two independent public jobs verified downloaded metadata/tag/source/main/assets, prior beta9 ZIP, actual HACS workflows and both native packages on both cores. Main and all beta1–9 releases/tags/assets remain unchanged. [Public receipt](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/feat/beta5-simple-onboarding/docs/receipts/v0.1.0-beta.10.json) · [Native proof](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/v0.1.0-beta.10/docs/receipts/v0.1.0-beta.10-simulation.json) · [Install/reset](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/v0.1.0-beta.10/docs/HACS_DISTRIBUTION.md) · [Dashboard YAML](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/v0.1.0-beta.10/docs/dashboard.yaml) · [Inventory](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/v0.1.0-beta.10/docs/MVP_CLEANUP.md).

          Draft/unmerged. HACS: enable Show beta versions, select beta.10, download/restart; follow explicit reset/recreation guide. No stable release, main merge, production HA, Node-RED or physical charging controls. Owner hardware/private-contract acceptance remains separate. Stop after verified beta.10.
          MD
          gh api "repos/$GITHUB_REPOSITORY/pulls/14" --method PATCH --raw-field title='Beta.10: minimal electricity price engine and read-only API v2' -F body=@"$RUNNER_TEMP/beta10-pr-final.md" --jq '{number,html_url,draft}'
