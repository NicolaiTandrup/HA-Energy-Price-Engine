name: Publish authorized PE beta.6
on:
  push:
    branches: [feat/beta5-simple-onboarding]
    paths: [.github/workflows/publish-beta6.yml]
permissions:
  contents: write
  checks: read
  actions: read
  pull-requests: write
concurrency:
  group: publish-pe-v0.1.0-beta.6
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PE_SOURCE: f5a18152748205906bfd5e7ae7a72b592943e742
      PE_TAG: v0.1.0-beta.6
      PE_TAG_OBJECT: 570a889b653acbabff7a590c542f5b70b3901cf6
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v0.1.0-beta.6
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.8'
      - uses: astral-sh/setup-uv@v6
      - name: Verify immutable authorized source and successful checks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PE_SOURCE"
          test "$(git rev-parse "$PE_TAG")" = "$PE_TAG_OBJECT"
          test "$(git cat-file -t "$PE_TAG")" = "tag"
          test "$(git rev-parse "$PE_TAG^{commit}")" = "$PE_SOURCE"
          python - <<'PY_CHECK'
          import json, os, subprocess, time
          sha=os.environ['PE_SOURCE']
          for attempt in range(30):
              result=json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/commits/{sha}/check-runs']))
              checks=result['check_runs']
              if len(checks)>=15 and all(c['status']=='completed' and c['conclusion']=='success' for c in checks):
                  break
              if any(c['status']=='completed' and c['conclusion'] not in ('success',) for c in checks):
                  raise SystemExit('Exact-source CI did not pass; publication prohibited')
              time.sleep(10)
          else:
              raise SystemExit('Exact-source CI is still pending; publication prohibited')
          from pathlib import Path
          repository=os.environ['GITHUB_REPOSITORY']
          def api(path):return json.loads(subprocess.check_output(['gh','api',f'repos/{repository}/{path}']))
          assert api('commits/main')['sha']=='56cdb3c10993179371483812cbc36f651ba3ad8e'
          pr=api('pulls/14');assert pr['state']=='open' and pr['draft'] and pr['head']['ref']=='feat/beta5-simple-onboarding'
          for number in range(1,6):
              prior=json.loads(Path(f'docs/receipts/v0.1.0-beta.{number}.json').read_text())
              tag=f'v0.1.0-beta.{number}';release=api('releases/tags/'+tag)
              assert release['id']==prior['release_id'] and release['prerelease'] and not release['draft']
              assert api('git/ref/tags/'+tag)['object']['sha']==prior.get('tag_object',prior.get('annotated_tag_object'))
              assets={a['name']:a for a in release['assets']}
              for name,digest in prior.get('archive_hashes',prior.get('archive_sha256')).items():assert assets[name]['digest']=='sha256:'+digest
          PY_CHECK
      - name: Build clean source and independently install both layouts
        run: |
          set -euo pipefail
          uv venv
          uv pip sync --require-hashes requirements-ha-current.lock
          uv run --no-project python tools/build_beta.py
          python - <<'PY_INTEGRITY'
          import hashlib,json,os
          from pathlib import Path
          manifest=json.loads(Path('dist/BUILD_MANIFEST.json').read_text())
          assert manifest['commit']==os.environ['PE_SOURCE'] and not manifest['dirty']
          expected={'ha_energy_price_engine.zip':'909c75c26649e91f6dfb4d908f36db8dd65cd83c4a72153be9beef6d890630de', 'ha_energy_price_engine-manual.zip':'d0b3672ddfe0a984adae40a75e6f8fc66a15c371263d93cd783409812b83e2ea'}
          assert manifest['archives']==expected
          for name,digest in expected.items():
              assert hashlib.sha256((Path('dist')/name).read_bytes()).hexdigest()==digest
          PY_INTEGRITY
          uv run --no-project python tools/smoke_install_package.py dist/ha_energy_price_engine.zip
          uv run --no-project python tools/smoke_install_package.py dist/ha_energy_price_engine-manual.zip
      - name: Publish authorized immutable beta.6 only
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/pe-beta6-notes.md" <<'PE_NOTES'
          Beta.6 simplifies native setup to **official Nord Pool → confirmed grid tariff → actual supplier markup**. Enter fractional **øre/kWh** with a point or comma and confirm VAT. No ordinary product/monthly/date/heating decisions. Each accepted page saves; Configure resumes after closing. Review needs no final save.
          
          **Prerelease for development Home Assistant acceptance.** Actual agreements, real providers and hardware still require owner checks. Source **f5a18152748205906bfd5e7ae7a72b592943e742**; immutable **v0.1.0-beta.6**. [Draft PR #14](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/pull/14) stays unmerged. Main and all prior releases preserved.
          
          ## HACS install/update
          
          1. Back up development HA. Add `https://github.com/NicolaiTandrup/HA-Energy-Price-Engine` as a HACS custom **Integration** repository if needed.
          2. Persist **Show beta versions**, refresh information, select **v0.1.0-beta.6**, download and restart HA. Reload browser/app. Device info must show **0.1.0-beta.6**.
          3. Existing users: Configure the existing site. New users: install/configure official Home Assistant Nord Pool first, then Add integration → Energy Price Engine. No simultaneous legacy broker is needed.
          4. Confirm the actual area and grid class; automatic Radius C requires an actual Radius C contract. Enter the actual supplier markup/VAT. National public charges are automatic within documented verified periods. Never substitute a public offer or another site's agreement for your contract.
          5. Review raw/final coverage. Final prices opens current/future canonical component diagnostics and the optional supplied-quarter-kWh cost estimate. Check prices forces verification. Advanced retains dated overrides, source contracts, optional offers/heating/display and storage/site tools.
          
          [Illustrated setup / 26 screenshots](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/v0.1.0-beta.6/docs/WIZARD_GUIDE.md) · [HACS procedure](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/v0.1.0-beta.6/docs/HACS_DISTRIBUTION.md) · [Acceptance checklist](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/v0.1.0-beta.6/docs/BETA_ACCEPTANCE.md) · [Native simulation receipt](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/v0.1.0-beta.6/docs/receipts/v0.1.0-beta.6-simulation.json)
          
          ## Changes and safety
          
          - Decimal-safe **0.25/0.50/0.75/3.125** markup, localized comma, exact saved decimal values and explicit VAT basis. Fixed monthly fees never enter marginal prices or session costs.
          - Named server-resolved menus, complete EN/en-GB/DA forms, compatibility with cached draft_status descriptions, actionable source/timezone errors. Official mode hides irrelevant entity fields; alternate mode requires a complete source contract. Interrupted beta.5 agreements resume the new simple form.
          - Current/future component amounts/source/period/status read **canonical stored components**. Every quarter uses its own Radius time band and dated revision; VAT is applied once. Raw prices remain independent. Missing/stale rates never become zero.
          - An optional read-only calculator uses **supplied** planned/measured kWh for consecutive quarters and API v1 verified prices. It invents no energy or plan, excludes fixed fees and is explicitly an estimate, never settled accounting. Future energy must be planned. CM retains session/planning/control ownership.
          - Explicitly approved visual estimates remain **Provisional**, separate from verified history/revisions/API READY and unavailable for authoritative session costs. Retained stale rows never override a fresh approved visualization estimate.
          - Existing beta.1–.5 IDs, names, source references, mappings, dated rules, overrides, entities, SQLite rows/revisions and canonical **DKK/kWh read-only API v1** are preserved. Tested actual beta.5 upgrade:10 configs/1,000 original rows unchanged; native restart14 configs/1,106 rows unchanged. Safe confirmed selected-site deletion retains other sites/recorder; HACS uninstall retains data.
          - New confirmed values begin **next complete quarter**, until changed. No settled/unknown-past backfill; explicit future rules survive. Initial-day full-day reads can be INCOMPLETE while complete active ranges are READY. Tomorrow depends on source publication.
          - Required local refreshes **13:05,13:20,13:40,23:59,00:01** preserved. Negative spot prices,92/96/100-quarter DST, season/midnight TOU and fail-closed recovery covered. Issue#10 graphs and whole-household invoice reconstruction remain separate.
          
          ## Validation and integrity
          
          **277 producer tests/core** on HA **2026.10.3 / current 2026.10.4**,88% coverage,zero skips;two unchanged upstream HACS deprecation warnings. Four unchanged consumer suites153/176/227/228 per core plus two coupled runtime cases/reference/core. Official hassfest/HACS/translations, all15 exact-source push/PR/tag checks and clean deterministic both-layout native installs pass before publication. Fresh independent postpublication jobs on both cores verify public metadata/assets/source and actual pinned HACS2.0.5/upstream install/update/reinstall and semantic beta5→6 selection; permanent receipt is recorded only after both succeed.
          
          Native actual HA2026.10.4/frontend20260930.5 EN/en-GB/DA desktop/mobile simulation uses recorded/synthetic provider boundaries, not owner acceptance. Peak147.946625ore then normal68.3155ore with fictional0.5ore exVAT markup; supplied1.25/2kWh costs3.2156428125DKK. All current/future amounts and source identities are inspectable. Normal/fall/spring Radius96/100/92 rows use their own TOU.
          
          ZIP SHA256:
          - `ha_energy_price_engine.zip`: `909c75c26649e91f6dfb4d908f36db8dd65cd83c4a72153be9beef6d890630de`
          - `ha_energy_price_engine-manual.zip`: `d0b3672ddfe0a984adae40a75e6f8fc66a15c371263d93cd783409812b83e2ea`
          
          ## Limits
          
          Automatic DSO starts with Radius C; other products/future periods need verified rules. National values are bounded dated baselines, not live legislation discovery. Never guess heating eligibility/private contracts. Accepted pages persist; closing cannot save unsubmitted typing and native forms have no dedicated per-page Back. Entity names follow HA registry/system language; forms follow user language. HACS external catalog icon may fall back. Original SQLite touched-row performance retained:cloud35,136 rows/18.24MB,96-row append.0288s/reload1.066s/indexedlookup5.29µs. **Cloud timings do not establish Raspberry Pi performance.** History remains in RAM for API v1; measure hardware capacity/recovery yourself.
          
          No production HA, Node-RED, vehicles, chargers or CM controls touched. No main merge/stable release. Stop after beta.6 publication, independent verification and permanent handoff.
          PE_NOTES
          if gh release view "$PE_TAG" >/dev/null 2>&1; then
            python - <<'PY_EXISTING'
          import json,os,subprocess
          data=json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/releases/tags/{os.environ["PE_TAG"]}']))
          assert data['prerelease'] and not data['draft'] and data['tag_name']==os.environ['PE_TAG']
          assets={a['name']:a for a in data['assets']}
          expected=json.load(open('dist/BUILD_MANIFEST.json'))['archives']
          assert set(assets)=={*expected,'BUILD_MANIFEST.json','SHA256SUMS'}
          for name,digest in expected.items():assert assets[name]['digest']=='sha256:'+digest
          print('Existing immutable beta.6 matches authorized hashes; no release/asset mutation')
          PY_EXISTING
          else
            gh release create "$PE_TAG" dist/ha_energy_price_engine.zip dist/ha_energy_price_engine-manual.zip dist/BUILD_MANIFEST.json dist/SHA256SUMS --prerelease --latest=false --verify-tag --title 'v0.1.0-beta.6 — simple marginal charging prices' --notes-file "$RUNNER_TEMP/pe-beta6-notes.md"
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$PE_TAG" --jq '{html_url,tag_name,draft,prerelease,assets:[.assets[].name]}'
  verify-public:
    name: Verify public beta.6 (${{ matrix.target }})
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ha-2026.10.3
            lockfile: requirements-dev.lock
          - target: ha-2026.10.4
            lockfile: requirements-ha-current.lock
    env:
      GH_TOKEN: ${{ github.token }}
      PE_SOURCE: f5a18152748205906bfd5e7ae7a72b592943e742
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v0.1.0-beta.6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.8'
      - uses: astral-sh/setup-uv@v6
      - name: Prepare independent hash-verified core and actual HACS references
        run: |
          set -euo pipefail
          uv venv
          uv pip sync --require-hashes ${{ matrix.lockfile }}
          uv run --no-project python tools/prepare_hacs_reference.py
      - name: Independently download public assets and test HACS and both native layouts
        run: |
          set -euo pipefail
          uv run --no-project python tools/verify_public_release.py --expected-commit "$PE_SOURCE" --output "$RUNNER_TEMP/public-beta6"
          uv run --no-project python - <<'PY_CHANNEL'
          import json,os,subprocess
          from pathlib import Path
          from custom_components.ha_energy_price_engine.update import release_for
          feed=json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/releases']))
          assert release_for(feed,'0.1.0-beta.5')['tag_name']=='v0.1.0-beta.6'
          assert release_for(feed,'0.1.0-beta.6')['tag_name']=='v0.1.0-beta.6'
          stable=release_for(feed,'0.1.0')
          assert stable is None or (not stable['prerelease'] and '-' not in stable['tag_name'])
          path=Path(os.environ['RUNNER_TEMP'])/'public-beta6/PUBLIC_RELEASE_RECEIPT.json'
          data=json.loads(path.read_text())
          data['public_release_channel_selection']={'beta5_to_beta6':True,'installed_beta6_stays_current':True,'stable_excludes_beta_and_hashes':True}
          path.write_text(json.dumps(data,indent=2)+'\n')
          print('Public semantic release channel selection passed')
          PY_CHANNEL
      - uses: actions/upload-artifact@v4
        with:
          name: pe-beta6-public-${{ matrix.target }}
          path: ${{ runner.temp }}/public-beta6/PUBLIC_RELEASE_RECEIPT.json
          if-no-files-found: error
  audit:
    name: Record verified beta.6 publication
    needs: [publish, verify-public]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PE_SOURCE: f5a18152748205906bfd5e7ae7a72b592943e742
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/beta5-simple-onboarding
      - uses: actions/download-artifact@v5
        with:
          pattern: pe-beta6-public-*
          path: public-verification
      - name: Record public verification and preserve main and prior tags
        run: |
          set -euo pipefail
          python - <<'PY_AUDIT'
          import json,os,subprocess,urllib.request
          from pathlib import Path
          from datetime import UTC,datetime
          repository=os.environ['GITHUB_REPOSITORY'];source=os.environ['PE_SOURCE'];tag='v0.1.0-beta.6'
          def api(path):return json.loads(subprocess.check_output(['gh','api',f'repos/{repository}/{path}']))
          receipts={p.parent.name:json.loads(p.read_text()) for p in Path('public-verification').rglob('PUBLIC_RELEASE_RECEIPT.json')}
          assert len(receipts)==2
          expected={'ha_energy_price_engine.zip':'909c75c26649e91f6dfb4d908f36db8dd65cd83c4a72153be9beef6d890630de','ha_energy_price_engine-manual.zip':'d0b3672ddfe0a984adae40a75e6f8fc66a15c371263d93cd783409812b83e2ea'}
          for receipt in receipts.values():
              assert receipt['source_commit']==source and receipt['archive_hashes']==expected
              assert receipt['isolated_hacs_and_native_install']=='passed'
              assert all(receipt['public_release_channel_selection'].values())
          release=api('releases/tags/'+tag)
          assert release['prerelease'] and not release['draft']
          assert api('commits/main')['sha']=='56cdb3c10993179371483812cbc36f651ba3ad8e'
          assert api('git/ref/tags/v0.1.0-beta.4')['object']['sha']=='90cb819f001fd390ca35e1c83f26d3c6303c4de1'
          assert api('git/ref/tags/v0.1.0-beta.3')['object']['sha']=='73b9e9e48d4cb17c69ecff4f77d9c992a5307516'
          prior=[]
          for number in range(1,6):
              previous=json.loads(Path(f'docs/receipts/v0.1.0-beta.{number}.json').read_text())
              oldtag=f'v0.1.0-beta.{number}'; old=api('releases/tags/'+oldtag)
              assert old['id']==previous['release_id'] and old['prerelease'] and not old['draft']
              assert api('git/ref/tags/'+oldtag)['object']['sha']==previous.get('tag_object',previous.get('annotated_tag_object'))
              assets={a['name']:a for a in old['assets']}
              for name,digest in previous.get('archive_hashes',previous.get('archive_sha256')).items():
                  assert assets[name]['digest']=='sha256:'+digest
              for asset in previous.get('assets',[]):
                  assert all(assets[asset['name']].get(k)==asset[k] for k in ('id','size','digest') if k in asset)
              prior.append({'tag':oldtag,'release_id':old['id'],'tag_and_asset_integrity_preserved':True})
          tag_object=api('git/ref/tags/'+tag)['object']['sha'];assert tag_object=='570a889b653acbabff7a590c542f5b70b3901cf6'
          checks=api(f'commits/{source}/check-runs')['check_runs']
          assert len(checks)>=15 and all(c['conclusion']=='success' for c in checks)
          with urllib.request.urlopen(urllib.request.Request(release['html_url'],headers={'User-Agent':'PE-public-acceptance'}),timeout=30) as response:status=response.status
          assert status==200
          jobs=api(f'actions/runs/{os.environ["GITHUB_RUN_ID"]}/jobs')['jobs']
          completed=[j for j in jobs if j['name'].startswith(('publish','Verify public'))]
          assert len(completed)==3 and all(j['conclusion']=='success' for j in completed)
          report={'schema':1,'verified_at':datetime.now(UTC).isoformat(),'tag':tag,'source_commit':source,'tag_object':tag_object,'main_commit':'56cdb3c10993179371483812cbc36f651ba3ad8e','main_unmerged':True,'previous_releases_preserved':True,'prior_releases':prior,'release_url':release['html_url'],'release_id':release['id'],'draft':False,'prerelease':True,'unauthenticated_release_page_http':status,'archive_hashes':expected,'assets':[{k:a.get(k) for k in ('name','id','size','digest','browser_download_url')} for a in release['assets']],'publisher':{'id':int(os.environ['GITHUB_RUN_ID']),'html_url':f'https://github.com/{repository}/actions/runs/{os.environ["GITHUB_RUN_ID"]}','head_sha':os.environ['GITHUB_SHA'],'publication_and_both_verification_jobs':'success','workflow_final_conclusion':'pending audit completion'},'exact_source_checks':[{'name':c['name'],'id':c['id'],'conclusion':c['conclusion'],'url':c['html_url']} for c in checks],'validation':{'ha_cores':['2026.10.3','2026.10.4'],'producer_cases_per_core':277,'producer_coverage_percent':88,'skips':0,'warnings':'Two deprecation warnings in pinned upstream HACS code','unchanged_consumer_cases_per_core':{'pr15':153,'pr16':176,'pr25':227,'pr26':228},'actual_coupled_runtime_cases_per_consumer_per_core':2,'public_verification':'Fresh independent GitHub runner jobs on both locked cores; actual public metadata/assets/tag source/main plus unchanged pinned HACS2.0.5/upstream and both native ZIP layouts outside source','native_frontend':'Disposable HA2026.10.4/frontend20260930.5 EN/DA desktop/mobile; synthetic boundaries','simulation_receipt':'docs/receipts/v0.1.0-beta.6-simulation.json','public_release_channel_selection':'beta5 chooses beta6; installed beta6 current; stable excludes prereleases/hashes'},'public_verification_receipts':receipts,'owner_acceptance':False,'remaining_limitations':['Actual private markup/VAT require user confirmation; optional EWII offers remain Advanced only.','National baselines are bounded dated data; other products/future periods require verified rules. Heating eligibility is never guessed.','New agreements start next complete quarter; first day may have only remaining-day coverage, never unknown past backfill.','Native Close cannot submit typed fields; no dedicated per-page Back; avoid simultaneous edits of one site.','Entity names follow system/registry language; forms follow user language. HACS external brand catalog can show fallback.','Cloud SQLite measurements do not establish Raspberry Pi performance; history remains in memory for APIv1.'],'production_controls_touched':False}
          Path('docs/receipts/v0.1.0-beta.6.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          PY_AUDIT
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/receipts/v0.1.0-beta.6.json
          git commit -m 'docs: record independent public beta.6 verification on both cores'
          git push origin HEAD:refs/heads/feat/beta5-simple-onboarding
      - name: Update existing draft PR with verified prerelease
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/pe-beta6-pr.md" <<'PE_PR'
          Beta.6 is published and independently verified: https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/releases/tag/v0.1.0-beta.6
          
          Exact immutable source **f5a18152748205906bfd5e7ae7a72b592943e742**, tag object **570a889b653acbabff7a590c542f5b70b3901cf6**. This existing PR remains draft/unmerged. Main and beta.1–.5 tags/assets preserved. Owner authorizes beta.6 prerelease only; no production/stable/merge authorization.
          
          Ordinary setup now has three accepted/saved stages: official Nord Pool → confirmed grid tariff → actual fractional supplier markup/VAT. No normal dates/monthly/product/heating. Decimal-safe point/comma0.25/0.50/0.75/3.125, exact persistence, preserved historical/future overrides. Named menus/complete EN/en-GB/DA forms, old draft_status cache compatibility, relevant source fields and actionable errors. Interrupted beta.5 contracts resume the new markup form.
          
          Current/future diagnostics read canonical stored amounts/source/period/status, each quarter's own Radius TOU and VAT once. Optional supplied-quarter-kWh session estimate is read-only and requires verified APIv1 prices; no guessed energy, fixed fees, accounting or charging commands. Explicit provisional records remain outside verified SQLite/API READY; missing/stale never becomes zero. Proven engine/SQLite/API/schedules and beta.1–.5 identities/history/entities preserved.
          
          **Validation:** all15 source push/PR/tag jobs green;277 producer cases/core on HA2026.10.3/.4,88% coverage,zero skips. Unchanged consumers153/176/227/228/core+two coupled runtime cases/reference/core. Hassfest/HACS/translations and both native package layouts pass. Two independent postpublication jobs downloaded actual public assets/source/metadata and exercised pinned HACS2.0.5/upstream install/update/reinstall and semantic beta5→6 selection. Receipts include exact checks/assets/hashes.
          
          Native HA2026.10.4/frontend20260930.5 EN/en-GB/DA desktop/mobile:3-stage setup,fractions,invalid input,save/close/resume,cache compatibility,missing/provisional/verified,future components/cost,outage/recovery,beta.5 migration,restart and selected109-row deletion/recreation.10 beta.5 configs/1,000 original rows/revisions unchanged;restart14 configs/1,106 rows unchanged.26 screenshots;synthetic/recorded software evidence, not owner acceptance. Cloud35,136-row SQLite benchmark retains touched-row improvements; not Raspberry Pi results.
          
          [Illustrated guide](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/v0.1.0-beta.6/docs/WIZARD_GUIDE.md) · [HACS steps](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/v0.1.0-beta.6/docs/HACS_DISTRIBUTION.md) · [Publication receipt](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/feat/beta5-simple-onboarding/docs/receipts/v0.1.0-beta.6.json) · [Permanent handoff](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/feat/beta5-simple-onboarding/docs/DEVELOPMENT_STATUS.md)
          
          HACS:enable/persist Show beta versions,refresh,selectv0.1.0-beta.6,download/restart/reload. Existing users Configure current site. Actual provider/contract/hardware acceptance remains owner-run. Bounded national defaults,Radius C first; no heating/private terms guessed. Closing cannot save unsubmitted typing; no per-page Back. External HACS brand may fall back. Issue#10 graphs remain separate. No production HA,Node-RED,CM,vehicles or charging controls changed. Stop after publication/verification/handoff. Refs#8,#12.
          PE_PR
          gh api "repos/$GITHUB_REPOSITORY/pulls/14" --method PATCH --raw-field title='Beta.6: simple marginal charging prices and fractional markup' -F body=@"$RUNNER_TEMP/pe-beta6-pr.md" --jq '{number,html_url,draft}'
