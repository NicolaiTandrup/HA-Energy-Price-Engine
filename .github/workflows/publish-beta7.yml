          **Validation:**308 producer cases/core HA2026.10.3/.4,88% coverage,zero skips;unchanged consumers153/176/227/228/core plus two coupled runtime cases/reference/core. All16 exact-source checks green, all publication/public-verification jobs succeed. Hassfest/HACS/translations and both native ZIP layouts pass. Two fresh public jobs downloaded real metadata/assets/source and exercised pinned HACS2.0.5/upstream install/update/reinstall and beta6→7 semantic availability on both cores. Independent public hashes/source/native/HACS verification is recorded in the receipt.

          Native EN/en-GB/DA desktop/mobile HA2026.10.4/frontend20260930.5 journeys passed2/4 decimals, raw/final, user/system locale, selected future components and ready/missing horizons, no frontend errors/warnings. Beta.6 upgrade15 configs/1,211 rows/315 entity IDs/29 Recorder unit metadata unchanged. Restart16configs/1,314rows unchanged.250 repeated read guards/case and actual SQL indexed read-only plan. Current16:45→next17:00 recorded Radius example68.32→147.95ore; supplied1.25/2kWh costs3.81287625DKK from canonical values. Synthetic/recorded software evidence, not owner acceptance.

          [Setup/current-next examples](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/v0.1.0-beta.7/docs/WIZARD_GUIDE.md) · [HACS steps](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/v0.1.0-beta.7/docs/HACS_DISTRIBUTION.md) · [Publication receipt](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/feat/beta5-simple-onboarding/docs/receipts/v0.1.0-beta.7.json) · [Permanent handoff](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/feat/beta5-simple-onboarding/docs/DEVELOPMENT_STATUS.md)

          HACS:persist Show beta versions,refresh,selectv0.1.0-beta.7,download/restart/reload. Configure existing site; Check future window uses APIv1, not a charging plan. Default display entities have fixed unit identities; HA card/entity overrides may supersede suggestions. Actual contracts/providers/hardware remain owner acceptance; cloud benchmarks are not Pi results. Original35,136-row SQLite storage18.24MB/touched-row append retained. No production HA,Node-RED,CM or physical control changes; no stable or merge. Stop after verification/final handoff. Refs#8,#12.
          PE_PR
          gh api "repos/$GITHUB_REPOSITORY/pulls/14" --method PATCH --raw-field title='Beta.7: consistent prices and independent charging-window readiness' -F body=@"$RUNNER_TEMP/pe-beta7-pr.md" --jq '{number,html_url,draft}'
