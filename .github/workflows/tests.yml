name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    name: tests (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: fixture-supported-ha-2026.10.3
            lockfile: requirements-dev.lock
          - target: current-ha-2026.10.4
            lockfile: requirements-ha-current.lock
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.8'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
      - name: Install exact hash-verified environment
        run: uv venv && uv pip sync --require-hashes ${{ matrix.lockfile }}
      - name: Prepare immutable consumer test dependencies
        run: uv run --no-project python tools/prepare_consumer_refs.py
      - name: Prepare pinned actual HACS workflow dependencies
        run: uv run --no-project python tools/prepare_hacs_reference.py
      - run: uv run --no-project ruff check custom_components tests tools
      - run: uv run --no-project ruff format --check custom_components tests tools
      - run: uv run --no-project pytest --cov=custom_components.ha_energy_price_engine --cov-report=term-missing -W error::ResourceWarning
      - name: Actual PE and CM PR 15 runtimes, revisions and unload safety
        run: uv run --no-project python tools/test_two_runtime.py --consumer pr15
      - name: Actual PE and CM PR 16 measured-history runtimes
        run: uv run --no-project python tools/test_two_runtime.py --consumer pr16
      - name: Full unchanged CM PR 15 suite against candidate API
        run: uv run --no-project python tools/run_consumer_suite.py --consumer pr15
      - name: Full unchanged CM PR 16 measured-history suite
        run: uv run --no-project python tools/run_consumer_suite.py --consumer pr16
      - name: Latest CM PR 25 packaged candidate runtimes and full suite
        run: |
          uv run --no-project python tools/test_two_runtime.py --consumer pr25
          uv run --no-project python tools/run_consumer_suite.py --consumer pr25
      - name: Latest CM PR 26 acknowledgment hardening runtimes and full suite
        run: |
          uv run --no-project python tools/test_two_runtime.py --consumer pr26
          uv run --no-project python tools/run_consumer_suite.py --consumer pr26
  dashboard:
    name: dashboard browser desktop and mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.8'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
      - run: uv venv && uv pip sync --require-hashes requirements-ha-current.lock
      - name: Generate actual HA producer/source/ledger frontend fixtures
        env:
          PE_FRONTEND_FIXTURES: ${{ runner.temp }}/pe-dashboard-fixtures
        run: uv run --no-project pytest tests/test_beta8_dashboard.py -W error::ResourceWarning
      - name: Install locked browser test dependencies
        run: |
          npm ci --ignore-scripts --prefix tests/frontend
          cd tests/frontend
          npx playwright install --with-deps chromium
      - name: Check shipped module and test graphs/tables/interaction/locale/revisions
        env:
          PE_FRONTEND_FIXTURES: ${{ runner.temp }}/pe-dashboard-fixtures
        run: |
          node --check custom_components/ha_energy_price_engine/www/energy-price-engine-card.js
          node --test tests/frontend/dashboard.test.mjs
