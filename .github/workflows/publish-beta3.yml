name: Publish authorized PE beta.3
on:
  push:
    branches: [feat/beta3-functional-onboarding]
    paths: [.github/workflows/publish-beta3.yml]
permissions:
  contents: write
  checks: read
  actions: read
concurrency:
  group: publish-pe-v0.1.0-beta.3
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PE_SOURCE: 78ef9ba4d02ccb85b9395991d1376fbdec34bb84
      PE_TAG: v0.1.0-beta.3
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v0.1.0-beta.3
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.8'
      - uses: astral-sh/setup-uv@v6
      - name: Verify immutable authorized source and successful checks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PE_SOURCE"
          test "$(git rev-parse "$PE_TAG^{commit}")" = "$PE_SOURCE"
          python - <<'PY_CHECK'
          import json, os, subprocess, time
          sha=os.environ['PE_SOURCE']
          for attempt in range(30):
              result=json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/commits/{sha}/check-runs']))
              checks=result['check_runs']
              if len(checks)>=5 and all(c['status']=='completed' and c['conclusion']=='success' for c in checks):
                  break
              if any(c['status']=='completed' and c['conclusion'] not in ('success',) for c in checks):
                  raise SystemExit('Exact-source CI did not pass; publication prohibited')
              time.sleep(10)
          else:
              raise SystemExit('Exact-source CI is still pending; publication prohibited')
          PY_CHECK
      - name: Build clean source and independently install both layouts
        run: |
          set -euo pipefail
          uv venv
          uv pip sync --require-hashes requirements-ha-current.lock
          uv run --no-project python tools/build_beta.py
          python - <<'PY_INTEGRITY'
          import hashlib,json,os
          from pathlib import Path
          manifest=json.loads(Path('dist/BUILD_MANIFEST.json').read_text())
          assert manifest['commit']==os.environ['PE_SOURCE'] and not manifest['dirty']
          expected={'ha_energy_price_engine.zip':'300741806e86d5566b6ab025f814aac1c52d21c50bc2273c3a5ff4b20387c3e9', 'ha_energy_price_engine-manual.zip':'37b4af805818de1a200e34b7eb3a8c225b0624ef4003e0303485b0bf6bef8c5e'}
          assert manifest['archives']==expected
          for name,digest in expected.items():
              assert hashlib.sha256((Path('dist')/name).read_bytes()).hexdigest()==digest
          PY_INTEGRITY
          uv run --no-project python tools/smoke_install_package.py dist/ha_energy_price_engine.zip
          uv run --no-project python tools/smoke_install_package.py dist/ha_energy_price_engine-manual.zip
      - name: Publish only authorized beta prerelease with provenance assets
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/pe-beta3-notes.md" <<'PE_NOTES'
          Beta.3 fixes the beta.2 setup failure mode where verified Nord Pool data was hidden behind missing final-price components. Native Review now checks actual sources and the canonical calculator, shows every required dated component and links directly to corrections. Raw spot remains visible independently.
          
          **Read-only beta for PAHA02-DEV acceptance testing.** Isolated simulations and software checks are not owner acceptance.
          
          Source **78ef9ba4d02ccb85b9395991d1376fbdec34bb84**, tag **v0.1.0-beta.3**. [Draft PR #11](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/pull/11) stays unmerged; HACS-compatible main remains beta.1. Beta.1/.2 tags/assets are unchanged. No stable release or live cutover.
          
          ## Update and focused retest
          
          1. Back up PAHA02-DEV. In HACS → Energy Price Engine, keep **Show beta versions enabled in repository controls**, refresh information, select **v0.1.0-beta.3**, download, then restart HA.
          2. Existing site: Devices & services → Energy Price Engine → **Configure**. Do not delete/recreate. Device info must show **0.1.0-beta.3**.
          3. Follow site/official Nord Pool → grid → supplier → national charges → display → Review. Official input is automatically **DKK/MWh excluding VAT**; enter **25** for 25%, preferred display defaults to **øre/kWh**.
          4. Confirm the actual grid product. Enter only your actual verified dated supplier contract. New Danish sites visibly suggest documented bounded national components; existing overrides/choices remain. No private supplier amount or heating eligibility is guessed.
          5. Review raw coverage, final calculated quarters and each dated component. Correct marked fields through the named step. **Save & verify** is the first action; there is no extra hidden Save. Inspect actual runtime final status/problem after Save; preview calculation alone is not proof of a durable disk write.
          6. Retest both English/Danish profile languages and restart/history. For any failure record raw/final coverage, affected date, pricing-problem category and redacted PE diagnostics. No simultaneous live legacy Nordpool broker is required.
          
          [Complete illustrated setup/retest guide](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/v0.1.0-beta.3/docs/WIZARD_GUIDE.md) · [Exact HACS instructions](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/v0.1.0-beta.3/docs/HACS_DISTRIBUTION.md) · [Acceptance checklist](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/v0.1.0-beta.3/docs/BETA_ACCEPTANCE.md) · [Numerical simulation evidence](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/v0.1.0-beta.3/docs/receipts/v0.1.0-beta.3-simulation.json)
          
          ## Functional changes
          
          - Raw current/next spot prices and today/tomorrow coverage/readiness/timestamps are independent from supplier, grid and ledger composition. No missing quarter is manufactured. Cached raw intervals retain timestamps and expire within two hours.
          - Source verification appears during setup. Review uses the same canonical calculation as runtime in a transient sink; drafts never write ledgers. Complete inputs calculate final prices; missing input gets per-component/date correction, not forced READY.
          - Missing verified periods are INCOMPLETE; source, grid and storage failures are distinct. Stale provider/cache reports identify their corrective category. New localized final-status and problem entities coexist with compatible legacy uppercase states. verified_final_slots/raw_valid_slots/stored_slots clarify current verification versus retained history; API v1 remains unchanged.
          - Native English/Danish headings, fields, help, selectors, validation, Repairs and new enum states follow the user's UI language. Missing locales fall back to English. Canonical provenance keys and upstream technical exception text keep their original conventions.
          - Site IDs/names/source references, dated rates/overrides, original entities, SQLite rows/revisions and read-only CM API retained. Installed software version derives from the manifest. The proven SQLite write improvement and mandatory **13:05, 13:20, 13:40, 23:59, 00:01** refresh requirements are retained.
          
          ## Update-card investigation
          
          Actual pinned HACS code reproduces `installed beta.2 / latest 56cdb3c`: with **Show beta versions off** and no stable release, its available-version property falls back to main's commit. Selecting a beta download alone does not establish a persistent beta subscription. Keep beta visibility on, refresh, and confirm the latest semantic tag. Beta.3 hides default-branch selection in its HACS metadata.
          
          PE adds a read-only **Published PE release (update through HACS)** UpdateEntity: only published valid semantic tags, correct beta/stable channel, no drafts or development hashes. It does not install files, patch HACS or change user settings. HACS owns its separate update card; if it still shows a hash, correct its beta visibility and use the exact tag download. No stable release is published as a workaround.
          
          ## Validation and integrity
          
          - **200 producer tests** pass on HA **2026.10.3 and current 2026.10.4**, 89% coverage, zero skips. Exact-source CI includes full unchanged consumer suites, both runtime startup orders, HACS, official hassfest and independent package installation.
          - Complete native EN/DA first-run simulations actually persist 96 quarters per day: synthetic spot .100 + synthetic grid .200 + explicitly **fictional supplier .111** + .043 + .072 + .008 = .534 ex VAT; ×1.25 = **.6675 DKK/kWh / 66.75 øre/kWh**. Do not copy fictional contract values.
          - Missing supplier: raw 96 READY, final 0 INCOMPLETE, exact supplier period/action. Radius outage, partial source, stale retained source, storage failure and recovery remain distinct. Native desktop/mobile runs check interaction, no horizontal overflow and no frontend errors. Screenshots cover the English and Danish stages.
          - Separate canonical runtime tests cover negative prices and normal/92/100-quarter days, verified heating eligibility and spring's absent hour. Actual released beta.1 AND beta.2 source seed upgrade fixtures; exact 192-row ledgers/UTC rows/amounts/revisions survive restart.
          - Unchanged actual HACS 2.0.5/upstream code checks main registration separately from exact selected tag, beta discovery/download/update/uninstall/reinstall. Both archive layouts install/configure/reload/delete/recreate outside the checkout.
          - BUILD_MANIFEST pins clean source/runtime hashes; SHA256SUMS checks both deterministic ZIPs. `published: false` means the builder itself does not publish; this authorized GitHub prerelease is separate.
          - Independent public source/assets/HACS/native install verification runs after publication; a permanent receipt is linked below once complete.
          
          ```text
          300741806e86d5566b6ab025f814aac1c52d21c50bc2273c3a5ff4b20387c3e9  ha_energy_price_engine.zip
          37b4af805818de1a200e34b7eb3a8c225b0624ef4003e0303485b0bf6bef8c5e  ha_energy_price_engine-manual.zip
          ```
          
          HACS normally extracts the selected tag's integration directory. For manual placement, extract the manual ZIP at HA's configuration root; the root-layout ZIP belongs inside custom_components/ha_energy_price_engine/.
          
          ## Limits and owner acceptance
          
          **Continue before Close/reload.** Native HA cannot submit fields still being typed; every page warns. Submitted drafts/errors/Back edits persist. No keystroke autosave or simultaneous-flow editing guarantee.
          
          Native HA entity names follow the system language/existing registry; they cannot be renamed independently for each viewer through the native entity API. Both name resources ship. Wizard/validation/Repairs/new enum states follow user UI language; original uppercase state/API contracts remain compatible. Technical provider data is not artificially translated.
          
          EWII household **.030 DKK/kWh ex VAT is June–September 2026 only**, never October/future/summer-house default. Heating requires explicit verified evidence; public periods are bounded, not live legislative discovery. Automatic grid verification initially supports confirmed Radius C; other classes use explicit manual rules.
          
          Cloud benchmarks are not Raspberry Pi evidence. All authoritative history remains in RAM and is not silently pruned. Owner current-source/contract/billing/hardware and physical mobile acceptance remain pending. No PAHA01, production HA, Node-RED, Tesla, Easee, charging commands, main merge, stable or CM release operation occurred.
          PE_NOTES
          gh release create "$PE_TAG" dist/ha_energy_price_engine.zip dist/ha_energy_price_engine-manual.zip dist/BUILD_MANIFEST.json dist/SHA256SUMS --prerelease --latest=false --verify-tag --title 'v0.1.0-beta.3 — verified onboarding and independent spot visibility' --notes-file "$RUNNER_TEMP/pe-beta3-notes.md"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$PE_TAG" --jq '{html_url,tag_name,draft,prerelease,assets:[.assets[].name]}'
