name: Continue beta.9 development PR
on:
  push:
    branches: [feat/beta5-simple-onboarding]
    paths: [.github/workflows/beta9-pr.yml]
permissions:
  contents: read
  pull-requests: write
jobs:
  draft:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Update existing draft with reviewable beta.9 progress
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/pe-beta9-pr.md" <<'BODY'
          Beta.9 continues the published beta.8 implementation for owner acceptance on #8 and #10. This focused release adds explicit native completion, understandable activation-boundary/status explanations and individual stored price component diagnostics. Preserve all beta.8 graphs/tables, pricing/SQLite and CM API v1. No main merge or stable/production/charging changes.

          Implementation checkpoint: visible native Done retains current saved settings, closes Options to integration, initial ConfigFlow completes without duplicate site. Eight stored-only component diagnostics (ore/kWh2), exact applied VAT amount, source/period/revision and explicit current/next breakdown scope. Native availability explains activation, publication, history, missing components and real verification/storage/stale failures. Dashboard keeps both graphs/tables and now explains activation. Numeric unknown and strict APIv1 remain unchanged.

          NEW canonical duplicates default off; upgrades preserve enabled entities, custom names/hides/disables/Recorder identities. Technical diagnostics is an explicit native opt-in/out selection, never a forced disable. Ordinary statuses use localized Title Case; existing advanced uppercase machine states preserved. Optional provisional preferences retained.

          Local333 producer tests/core HA2026.10.3/current.4,89% coverage,zero skips;17 locked browser regressions;Ruff and official hassfest1valid/0invalid. Actual released beta8 migration added.9 core engine/source/SQLite/API files byte-identical beta8. First completion checkpoint passed all13 CI checks; this implementation CI pending. Native HA.4 beta8 upgrade preserves6configs/168IDs/4logical ledgers; actual Done desktop/mobile works, activation screenshot currentIncomplete0/1,nextReady1/1,tomorrowReady96/96. Remaining native device/boundary/restart and full consumer/package/public release gates are in progress. No beta9 published yet and no owner real-HA acceptance claimed.

          Native follow-up shortens component labels so network/system remain distinguishable, shows exact activation time rather than HA relative time, and tests actual beta8 runtime-byte HACS update with real SQLite preservation. Native Recorder confirms the automatic19:45 boundary; final driver/locale/preferences/restart evidence and release gates are still pending. Both CM matrices passed153/176/227/228 plus2coupled/ref/core, and both clean package layouts independently installed on both cores.

          See docs/DEVELOPMENT_STATUS.md for exact checkpoints, commands/evidence and remaining gates. Owner authorizes beta9 prerelease only after mandatory validation; no main merge/stable/production HA/Node-RED/CM or charging changes.
          BODY
          test "$(gh pr view 14 --json isDraft --jq .isDraft)" = true
          test "$(gh pr view 14 --json headRefOid --jq .headRefOid)" = "$GITHUB_SHA"
          gh pr edit 14 --title "Beta.9: explicit setup completion and useful price diagnostics" --body-file "$RUNNER_TEMP/pe-beta9-pr.md"
