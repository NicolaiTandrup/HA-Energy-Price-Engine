name: Continue beta.9 development PR
on:
  push:
    branches: [feat/beta5-simple-onboarding]
    paths: [.github/workflows/beta9-pr.yml]
permissions:
  contents: read
  pull-requests: write
jobs:
  draft:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Update existing draft with reviewable beta.9 progress
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/pe-beta9-pr.md" <<'BODY'
          Beta.9 candidate completes the focused owner acceptance work on #8 and #10. It continues published beta.8 without restarting the engine. Publication awaits final exact-source CI/tag and independent public verification gates; no beta9 release published yet. Existing PR stays draft/unmerged; main and earlier releases preserved.

          Native Done explicitly finishes already-saved settings; no second Save/check. Current/tomorrow/statistics availability explains activation/publication/configuration/history/storage/verification with an exact activation timestamp. Eight distinct ore/kWh2 component diagnostics show actual stored spot/grid/Energinet network/system/supplier/tax, applied VAT amount and final, with source/effective/revision and explicit current/next period. No read fetch, SQL or tariff recomposition. Numeric unknown remains unknown; ordinary statuses localize Title Case, canonical machine enums/API unchanged.

          New technical duplicates/unused provisional default off. Upgrades preserve enabled entities, IDs, custom names/hides/disables and Recorder units. Technical diagnostics is an explicit native checkbox choice for existing sites. No force-disable of user-enabled entities. All9 engine/source/math/API/SQLite/scheduler files byte-identical beta8; original refreshes and contract boundaries retained.

          Validation:333 producer tests/core HA2026.10.3/current.4,89%coverage,zero skips;unchanged CM153/176/227/228/core plus2coupled/ref/core;17 locked browser regressions;Ruff/hassfest/HACS and both installed ZIP layouts. HACS seeds actual beta8 bytes and preserves real SQLite through update/uninstall/reinstall. All13 CI checks green on implementation checkpoint ec33fb480a5612d2047ae668702a9240733521a5; final source CI pending.

          Native HA.4/frontend20260930.5 desktop1440x1000/mobile390x844 EN/DA passes Done/close/reopen, all8 numerical components/VAT/source, preferences and unchanged graphs/tables/revisions. Actual unpatched20:00CET clock observed Unknown/currentIncomplete→Ready/current equals exact priorNext, historicalIncomplete/tomorrowReady, no backfill. Provider counters unchanged on reads;zero browser errors/warnings. Upgrade preserves6configs/168IDs/4ledgers;restart preserves7configs/287IDs/5ledgers while adding eighth QA site;14Recorder unit identities retained. All8 native values/source/revision match exact SQLite records.27 screenshot hashes/data/core-file identities in docs/receipts/v0.1.0-beta.9-simulation.json; files outside source in chat evidence. Synthetic/recorded QA, not owner real-HA acceptance.

          Setup, acceptance checklist and HACS guide updated. Existing sites keep enabled technical choices; optionally tidy through Configure → Technical diagnostics. Exact-source freeze/publication gates and commands in docs/DEVELOPMENT_STATUS.md. Owner authorizes tested beta9 prerelease only; no stable/main/production HA/Node-RED/CM/physical charging changes. Cloud benchmarks do not establish Raspberry Pi performance.
          BODY
          test "$(gh pr view 14 --json isDraft --jq .isDraft)" = true
          test "$(gh pr view 14 --json headRefOid --jq .headRefOid)" = "$GITHUB_SHA"
          gh pr edit 14 --title "Beta.9: explicit setup completion and useful price diagnostics" --body-file "$RUNNER_TEMP/pe-beta9-pr.md"
