name: Continue beta.8 development PR
on:
  push:
    branches: [feat/beta5-simple-onboarding]
    paths: [.github/workflows/beta8-pr.yml]
permissions:
  contents: read
  pull-requests: write
jobs:
  draft:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Update existing draft with reviewable beta.8 progress
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/pe-beta8-pr.md" <<'BODY'
          Beta.8 candidate implements #10's complete price visualization, with related #8/#12 usability fixes. Owner authorizes tested beta.8 prerelease only. Existing draft stays unmerged; main and all prior betas are preserved.

          Bundled dependency-free Lovelace card over a bounded authenticated HA WebSocket read: today/tomorrow raw spot exVAT and verified final inclVAT graphs, Now/day boundaries, every quarter's components/VAT/source/revision, today-only exact-merged DSO tariff ranges, current/selected-future inspection and independent current/history readiness. Default ore/kWh2; canonical CM APIv1/SQLite retain full DKK precision. Missing/stale/error/provisional final values are gaps, never zero. Reads do not fetch providers, open SQL or recompose tariffs. No price/charging write action or onboarding redesign.

          Unused estimates receive a one-time disabled default, retaining identities/history, user-owned hides/disables and subsequent explicit opt-in. Configured provisional remains separate. Supported lowercase presentation statuses use Title Case/localization; legacy canonical machine states remain unchanged (HA disallows uppercase translation keys). Large tables stay in the dedicated dashboard. Complete copy/paste YAML changes one actual PE sensor ID after registering the bundled local module in Resources; no extra frontend repo/CDN/service.

          Validation:324 producer tests/core HA2026.10.3/current.4,89% coverage,zero skips;unchanged CM suites153/176/227/228/core plus2 coupled runtime cases/ref/core.15 locked browser regressions/CI cover92/96/100, negative/zero, missing/unpublished/gaps, revisions, keyboard/mobile, EN/en-GB/DA/numeric preferences and XSS. Official hassfest1valid/0invalid, Ruff and both clean package layouts installed/imported outside source on both cores, including the actual installed HTTP module.

          Native HA2026.10.4/frontend20260930.5 desktop1440x1000/mobile390x844 passed both192-point graphs/all192 rows/four today-only DSO ranges, current/future components, raw-only/unpublished/partial/gap/provisional sites, persisted Danish locale, live revision updates and cleaned device diagnostics;zero browser errors/warnings. Read provider counters unchanged. Beta7 upgrade preserved6configs/4logical ledgers/162original IDs. Restart preserved6configs/168IDs/637rows/revisions/14Recorder unit identities.636 displayed stored rows match exact current OR historical SQL revisions including components/VAT/source.9 core runtime files byte-identical beta7. Synthetic/recorded software evidence, not owner contracts/hardware acceptance.

          [Dashboard installation + YAML](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/feat/beta5-simple-onboarding/docs/PRICE_DASHBOARD.md) · [Native screenshots/data receipt](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/feat/beta5-simple-onboarding/docs/receipts/v0.1.0-beta.8-simulation.json) · [Permanent handoff](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/feat/beta5-simple-onboarding/docs/DEVELOPMENT_STATUS.md).

          Candidate frozen for exact-source CI/tag gates; no beta8 release yet. After all mandatory green checks: authorized immutable prerelease and independent public HACS2.0.5/upstream/native installation verification on both cores. Local cloud API403 uses supported authorized runners, no proxy/credential bypass. Source/private contracts/heating never guessed; historical EWII terms not extrapolated. No main merge/stable/production HA/Node-RED/CM/physical charging changes. Cloud benchmarks are not Raspberry Pi results. Stop after publication and verification.
          BODY
          gh api "repos/$GITHUB_REPOSITORY/pulls/14" > "$RUNNER_TEMP/pr.json"
          python - <<'CHECK'
          import json,os
          p=json.load(open(os.environ['RUNNER_TEMP']+'/pr.json'))
          assert p['state']=='open' and p['draft'] and p['head']['ref']=='feat/beta5-simple-onboarding'
          assert p['head']['sha']==os.environ['GITHUB_SHA']
          CHECK
          gh api "repos/$GITHUB_REPOSITORY/pulls/14" --method PATCH --raw-field title='Beta.8: stored quarter-hour price dashboard, tariffs and components' -F body=@"$RUNNER_TEMP/pe-beta8-pr.md" --jq '{number,html_url,draft}'
