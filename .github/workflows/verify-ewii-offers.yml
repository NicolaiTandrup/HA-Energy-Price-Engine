name: Verify official EWII offers
on:
  push:
    branches: [feat/beta5-simple-onboarding]
    paths: [.github/workflows/verify-ewii-offers.yml]
permissions:
  contents: read
jobs:
  official:
    runs-on: ubuntu-latest
    steps:
      - name: Read current official product pages without customer data
        run: |
          python - <<'PY'
          import urllib.request,json,re,hashlib
          from html.parser import HTMLParser
          from datetime import UTC,datetime
          class Text(HTMLParser):
              def __init__(self):super().__init__();self.parts=[];self.skip=0
              def handle_starttag(self,tag,attrs):
                  if tag in ('script','style'):self.skip+=1
              def handle_endtag(self,tag):
                  if tag in ('script','style'):self.skip=max(0,self.skip-1)
              def handle_data(self,data):
                  if not self.skip:self.parts.append(data.strip())
          for product in ('basis-el','plus-el'):
              url=f'https://www.ewii.dk/privat/el/{product}/'
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=30) as r:
                      body=r.read(); final=r.url
                  parser=Text();parser.feed(body.decode());text=' '.join(p for p in parser.parts if p)
                  matches=list(re.finditer(r'(?i)(øre|moms|tillæg|abonnement|kr./md|kr/md)',text))
                  spans=[text[max(0,m.start()-120):m.end()+220] for m in matches]
                  data={'product':product,'url':final,'verified_at':datetime.now(UTC).isoformat(),'sha256':hashlib.sha256(body).hexdigest()}
                  unique=list(dict.fromkeys(spans[:8]+[v for v in spans if 'moms' in v.lower()]))
                  for i,term in enumerate(unique[:15]):
                      row=json.dumps({'product':product,'term':term},ensure_ascii=False).replace('%','%25').replace('\r','%0D').replace('\n','%0A')
                      print('::notice title=EWII term::'+row)
              except Exception as err:data={'product':product,'url':url,'error':str(err)}
              message=json.dumps(data,ensure_ascii=False).replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::notice title=EWII authoritative source::'+message)
          PY
