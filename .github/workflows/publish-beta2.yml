name: Publish authorized PE beta.2
on:
  push:
    branches: [feat/beta2-guided-setup]
    paths: [.github/workflows/publish-beta2.yml]
permissions:
  contents: write
  checks: read
  actions: read
concurrency:
  group: publish-pe-v0.1.0-beta.2
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PE_SOURCE: 0c93d2bfac88878cff46e7726f59accbeababf85
      PE_TAG: v0.1.0-beta.2
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v0.1.0-beta.2
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.8'
      - uses: astral-sh/setup-uv@v6
      - name: Verify immutable authorized source and successful checks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PE_SOURCE"
          test "$(git rev-parse "$PE_TAG^{commit}")" = "$PE_SOURCE"
          python - <<'PY_CHECK'
          import json, os, subprocess, time
          sha=os.environ['PE_SOURCE']
          for attempt in range(30):
              result=json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/commits/{sha}/check-runs']))
              checks=result['check_runs']
              if len(checks)>=5 and all(c['status']=='completed' and c['conclusion']=='success' for c in checks):
                  break
              if any(c['status']=='completed' and c['conclusion'] not in ('success',) for c in checks):
                  raise SystemExit('Exact-source CI did not pass; publication prohibited')
              time.sleep(10)
          else:
              raise SystemExit('Exact-source CI is still pending; publication prohibited')
          PY_CHECK
      - name: Build clean source and independently install both layouts
        run: |
          set -euo pipefail
          uv venv
          uv pip sync --require-hashes requirements-ha-current.lock
          uv run --no-project python tools/build_beta.py
          python - <<'PY_INTEGRITY'
          import hashlib,json,os
          from pathlib import Path
          manifest=json.loads(Path('dist/BUILD_MANIFEST.json').read_text())
          assert manifest['commit']==os.environ['PE_SOURCE'] and not manifest['dirty']
          expected={'ha_energy_price_engine.zip':'968a3436d7d44f20b4e86db405dcd26b553b9baa2a81dcfbf6eb9daf70776d91', 'ha_energy_price_engine-manual.zip':'a53f5a2ede9416b2eccf41a3f54f174410456e89e930001740a0de3465d80845'}
          assert manifest['archives']==expected
          for name,digest in expected.items():
              assert hashlib.sha256((Path('dist')/name).read_bytes()).hexdigest()==digest
          PY_INTEGRITY
          uv run --no-project python tools/smoke_install_package.py dist/ha_energy_price_engine.zip
          uv run --no-project python tools/smoke_install_package.py dist/ha_energy_price_engine-manual.zip
      - name: Publish only authorized beta prerelease with provenance assets
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/pe-beta2-notes.md" <<'PE_NOTES'
          Native **Energy Price Engine beta.2**: guided setup for new sites and existing beta.1 installations. Read-only producer; no charging or vehicle controls.
          
          Source: **`0c93d2bfac88878cff46e7726f59accbeababf85`**. Immutable tag **`v0.1.0-beta.2`**. PR #9 remains reviewable and unmerged; HACS-compatible main retains beta.1. Select this exact prerelease tag in HACS.
          
          ## Update on PAHA02-DEV
          
          1. Back up the test HA instance. In **HACS → Energy Price Engine → Download/Redownload**, enable **Show beta versions**, refresh repository information if necessary, and select **v0.1.0-beta.2**.
          2. Download, then **restart Home Assistant**.
          3. For an existing site open **Settings → Devices & services → Energy Price Engine → Configure**. Do not delete/recreate it. Confirm Device info software version **0.1.0-beta.2**.
          4. Follow the six stages: site/official Nord Pool → grid → supplier → national charges/tax → display → **Review, Save & verify**. Official input is automatic **DKK/MWh excluding VAT**; VAT is entered as **25** for 25%, and preferred display defaults to **øre/kWh**.
          5. Inspect readiness and precise missing-component/date/source/action attributes. Saved configuration does not mean READY prices; unknown components never become zero.
          
          First installation: HACS custom repository `https://github.com/NicolaiTandrup/HA-Energy-Price-Engine`, category **Integration**, select this beta, restart, then **Add integration → Energy Price Engine**. No simultaneous live legacy Nordpool broker is required or supported.
          
          [Illustrated desktop/mobile wizard](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/v0.1.0-beta.2/docs/WIZARD_GUIDE.md) · [Exact HACS update/setup](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/v0.1.0-beta.2/docs/HACS_DISTRIBUTION.md) · [Components/storage](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/v0.1.0-beta.2/docs/BETA_SETUP.md) · [Acceptance/rollback](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/v0.1.0-beta.2/docs/BETA_ACCEPTANCE.md)
          
          ## Changes
          
          - Resumable native wizard, visible progress/help, Next/Back/Review navigation, durable submitted drafts and validation errors, explicit Discard, atomic Save and source verification. Existing incomplete sites can resume. Unchanged Save also verifies again.
          - Readable official Nord Pool selector with no irrelevant entity-unit fields; supported area/timezone hints, provider/display units clearly separated. No private contract or heating eligibility is guessed.
          - Dated supplier/Radius/manual grid/Energinet/tax configuration and advanced overrides remain available. Missing-component errors identify the affected period and corrective action; strict fail-closed pricing remains.
          - Installed-manifest software version in Device info. Original site IDs/names/source references/overrides/SQLite rows/revisions, canonical DKK entities/statistics and read-only consumer API v1 retained. Five unit-specific preferred-display sensors avoid reinterpreting history when display units change.
          - Original quarter-hour engine, adapters, persistence improvement, DST handling and Copenhagen **13:05, 13:20, 13:40, 23:59, 00:01** refresh requirements preserved.
          
          ## Validation and integrity
          
          - **185 producer tests** on HA **2026.10.3 / 2026.10.4**, current core rechecked at publication; 88% coverage, zero skips. Ruff, official hassfest, HACS metadata and both exact-source CI lines pass.
          - Actual released beta.1 code seeds SQLite migration tests; bytes/rows/revisions and stable references survive. Full unchanged pinned consumer suites and actual coupled runtimes cover both startup orders and unload/revisions; no control calls.
          - Real HA frontend desktop **1440×1000** and mobile **390×844**: all stages/Back, missing periods, invalid-input recovery, draft close/reopen, explicit Discard, new-site and Options Save, device version; mobile has no horizontal overflow. Playwright/system Chromium fallback because Browser plugin was unavailable. Synthetic read-only source fixture; no owner installation accessed.
          - Unchanged pinned actual HACS 2.0.5/upstream methods test registration on beta.1 main separately from exact beta.2 tag selection/download/update/uninstall/reinstall. Both ZIP layouts install/configure/reload/remove/recreate outside the checkout.
          - `BUILD_MANIFEST.json` pins clean source and runtime-file hashes. `SHA256SUMS` verifies both ZIPs. Its `published: false` describes the builder's lack of publishing side effects; this prerelease is the separate authorized publication.
          - HACS normally downloads the selected tag's integration directory. For manual installation extract `ha_energy_price_engine-manual.zip` into HA's config root. The other ZIP extracts inside `custom_components/ha_energy_price_engine/`, not directly into the HA config root.
          
          SHA-256:
          
          ```text
          968a3436d7d44f20b4e86db405dcd26b553b9baa2a81dcfbf6eb9daf70776d91  ha_energy_price_engine.zip
          a53f5a2ede9416b2eccf41a3f54f174410456e89e930001740a0de3465d80845  ha_energy_price_engine-manual.zip
          ```
          
          Independent verification of actual public metadata/tag/source/assets and HACS/native installation runs immediately after publication; the final receipt is added below when complete.
          
          ## Known limits
          
          **Press Continue before closing a form.** Home Assistant's native Close/reload does not submit fields still being typed. Every page warns explicitly. Submitted fields, invalid inputs and Back edits persist across closing/restarting; this is not keystroke autosave. Do not edit the same site in simultaneous browser flows.
          
          EWII household **0.030 DKK/kWh ex VAT applies June–September 2026 only**. It is never an October/future/summer-house default. Other private terms and heating eligibility require explicit verified evidence. Automatic grid verification initially supports Radius C; other products need verified manual rates. National periods remain bounded.
          
          Existing DKK sensors/API remain canonical; use the new preferred-display sensors for øre. Changing display units activates another entity family and retains prior history. Cloud benchmarks do not establish Raspberry Pi performance; all history remains in RAM and is not silently pruned. Owner hardware/source/billing acceptance remains separate.
          
          No stable release, main merge, CM release, production Home Assistant, Node-RED or charging command operation is included.
          PE_NOTES
          gh release create "$PE_TAG" dist/ha_energy_price_engine.zip dist/ha_energy_price_engine-manual.zip dist/BUILD_MANIFEST.json dist/SHA256SUMS --prerelease --latest=false --verify-tag --title 'v0.1.0-beta.2 — guided native setup' --notes-file "$RUNNER_TEMP/pe-beta2-notes.md"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$PE_TAG" --jq '{html_url,tag_name,draft,prerelease,assets:[.assets[].name]}'
