name: Inspect and retry beta.8 dependency preparation
on:
  push:
    branches: [feat/beta5-simple-onboarding]
    paths: [.github/workflows/inspect-beta8-ci.yml]
permissions:
  contents: read
  actions: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v0.1.0-beta.8
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.8'
      - uses: astral-sh/setup-uv@v6
      - name: Inspect the failed job before any retry
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/123965561777" > "$RUNNER_TEMP/failed-job.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/123965561777/logs" > "$RUNNER_TEMP/failed-job.log"
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']);job=json.loads((root/'failed-job.json').read_text())
          assert job['run_id']==41026439801 and job['conclusion']=='failure'
          failed=[s for s in job['steps'] if s['conclusion']=='failure']
          assert len(failed)==1 and failed[0]['name']=='Prepare immutable consumer test dependencies'
          text=(root/'failed-job.log').read_text(errors='replace')
          text=re.sub(r'(?:ghs_|github_pat_)[A-Za-z0-9_]+','[REDACTED]',text)
          text=re.sub(r'Bearer [A-Za-z0-9._-]+','Bearer [REDACTED]',text)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Original beta.8 tag job failed before tests\n\nFailure step: pinned consumer dependency preparation. No test or verification gate is disabled.\n\n```text\n'+ '\n'.join(text.splitlines()[-55:])+'\n```\n')
          PY
      - name: Reproduce exact immutable preparation with verified dependencies
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = cbad4e7595e7eba4080aca295bfca521f9b0409a
          uv venv
          uv pip sync --require-hashes requirements-dev.lock
          uv run --no-project python tools/prepare_consumer_refs.py
          echo 'Clean preparation of the same immutable source and every pinned consumer succeeded.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retry the original failed job once, preserving source and tag
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess,time
          path=f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/41026439801'
          for attempt in range(30):
              run=json.loads(subprocess.check_output(['gh','api',path]))
              assert run['head_sha']=='cbad4e7595e7eba4080aca295bfca521f9b0409a'
              assert run['run_attempt']==1
              if run['status']=='completed':
                  assert run['conclusion']=='failure'
                  break
              time.sleep(10)
          else:raise SystemExit('Original run still pending; no retry requested')
          subprocess.run(['gh','api','--method','POST',path+'/rerun-failed-jobs'],check=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('\nOriginal failed job retry requested after clean immutable-source preparation passed. The full original producer/consumer checks must pass; no release published, tag/source unchanged.\n')
          PY
