name: Publish authorized PE beta.8
on:
  push:
    branches: [feat/beta5-simple-onboarding]
    paths: [.github/workflows/publish-beta8.yml]
permissions:
  contents: write
  checks: read
  actions: read
  pull-requests: write
concurrency:
  group: publish-pe-v0.1.0-beta.8
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PE_SOURCE: cbad4e7595e7eba4080aca295bfca521f9b0409a
      PE_TAG: v0.1.0-beta.8
      PE_TAG_OBJECT: 3dc0e28c119128e8ad397fc44da3b6b6c613b260
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v0.1.0-beta.8
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.8'
      - uses: astral-sh/setup-uv@v6
      - name: Verify immutable authorized source and successful checks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PE_SOURCE"
          test "$(git rev-parse "$PE_TAG")" = "$PE_TAG_OBJECT"
          test "$(git cat-file -t "$PE_TAG")" = "tag"
          test "$(git rev-parse "$PE_TAG^{commit}")" = "$PE_SOURCE"
          python - <<'PY_CHECK'
          import json, os, subprocess, time
          sha=os.environ['PE_SOURCE']
          for attempt in range(30):
              result=json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/commits/{sha}/check-runs']))
              checks=result['check_runs']
              if len(checks)>=19 and all(c['status']=='completed' and c['conclusion']=='success' for c in checks):
                  break
              if any(c['status']=='completed' and c['conclusion'] not in ('success',) for c in checks):
                  raise SystemExit('Exact-source CI did not pass; publication prohibited')
              time.sleep(10)
          else:
              raise SystemExit('Exact-source CI is still pending; publication prohibited')
          from pathlib import Path
          repository=os.environ['GITHUB_REPOSITORY']
          def api(path):return json.loads(subprocess.check_output(['gh','api',f'repos/{repository}/{path}']))
          assert api('commits/main')['sha']=='56cdb3c10993179371483812cbc36f651ba3ad8e'
          pr=api('pulls/14');assert pr['state']=='open' and pr['draft'] and pr['head']['ref']=='feat/beta5-simple-onboarding'
          for number in range(1,8):
              prior=json.loads(Path(f'docs/receipts/v0.1.0-beta.{number}.json').read_text())
              tag=f'v0.1.0-beta.{number}';release=api('releases/tags/'+tag)
              assert release['id']==prior['release_id'] and release['prerelease'] and not release['draft']
              assert api('git/ref/tags/'+tag)['object']['sha']==prior.get('tag_object',prior.get('annotated_tag_object'))
              assets={a['name']:a for a in release['assets']}
              for name,digest in prior.get('archive_hashes',prior.get('archive_sha256')).items():assert assets[name]['digest']=='sha256:'+digest
          PY_CHECK
      - name: Build clean source and independently install both layouts
        run: |
          set -euo pipefail
          uv venv
          uv pip sync --require-hashes requirements-ha-current.lock
          uv run --no-project python tools/build_beta.py
          python - <<'PY_INTEGRITY'
          import hashlib,json,os
          from pathlib import Path
          manifest=json.loads(Path('dist/BUILD_MANIFEST.json').read_text())
          assert manifest['commit']==os.environ['PE_SOURCE'] and not manifest['dirty']
          expected={'ha_energy_price_engine.zip':'09c259261e494e4ee1c074d049679b480be63d2a24790ad65bc58846ce165a08', 'ha_energy_price_engine-manual.zip':'d181c4dc488d3633b2a75bbd80e39f75a85268651bca3ae5e43ee12857510337'}
          assert manifest['archives']==expected
          for name,digest in expected.items():
              assert hashlib.sha256((Path('dist')/name).read_bytes()).hexdigest()==digest
          PY_INTEGRITY
          uv run --no-project python tools/smoke_install_package.py dist/ha_energy_price_engine.zip
          uv run --no-project python tools/smoke_install_package.py dist/ha_energy_price_engine-manual.zip
      - name: Publish authorized immutable beta.8 only
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/pe-beta8-notes.md" <<'PE_NOTES'
          Beta.7 standardizes **all preferred price displays to øre/kWh with exactly two decimals**, or optional **DKK/kWh with four**. Current/next and requested future-window readiness are independent from historical whole-day coverage. Stored canonical DKK/kWh, full precision, original entity/statistics units, SQLite and read-only CM APIv1 are preserved.

          **HACS prerelease for development Home Assistant acceptance.** Exact source **cbad4e7595e7eba4080aca295bfca521f9b0409a**. Immutable **v0.1.0-beta.8**; existing draft [PR #14](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/pull/14) remains unmerged. Main and beta.1–.7 tags/assets preserved. No stable release or production/control changes.

          ## Install/update and open the dashboard

          1. Back up development HA. HACS → Energy Price Engine → persist **Show beta versions**, refresh, select **v0.1.0-beta.8**, Download. Restart HA and reload browser/app. Device info must show **0.1.0-beta.8**. Keep existing sites/configuration/history.
          2. In HA user profile enable Advanced mode. **Settings → Dashboards → three-dot menu → Resources**: add `/ha_energy_price_engine/energy-price-engine-card.js?v=0.1.0-beta.8` as **JavaScript module**. The file is bundled in the integration HACS ZIP; no extra HACS frontend repository, chart plugin or external service.
          3. Create/open an empty dashboard → Edit dashboard → Raw configuration editor. Paste the complete YAML below and replace **only the one entity ID** with any sensor of the chosen PE site (e.g. Final now incl. VAT). Save and pin the dashboard in the sidebar. Do not replace an existing dashboard layout unintentionally.

          ```yaml
          title: Energy prices
          views:
            - title: Electricity prices
              path: electricity-prices
              icon: mdi:chart-timeline-variant
              type: panel
              cards:
                - type: custom:energy-price-engine-card
                  entity: sensor.your_site_final_now_incl_vat
          ```

          [Complete dashboard/resource guide](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/v0.1.0-beta.8/docs/PRICE_DASHBOARD.md) · [Pasteable YAML file](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/v0.1.0-beta.8/docs/dashboard.yaml) · [HACS setup/repair](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/v0.1.0-beta.8/docs/HACS_DISTRIBUTION.md) · [Owner acceptance](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/v0.1.0-beta.8/docs/BETA_ACCEPTANCE.md).

          ## Changes

          - **Two real quarter-hour series for today/tomorrow:** raw official Nord Pool spot excluding VAT/charges, and verified final marginal electricity including DSO, Energinet network/system, supplier per-kWh markup, tax and VAT. Both use **ore/kWh, exactly two decimals**, with shared local-calendar/UTC-continuous axes, Now marker and day boundary. Negative prices preserved; missing/stale/error/unverified final values are gaps, never manufactured zeros.
          - **Complete quarter table:** all local intervals plus UTC identities/offsets, spot, DSO, Energinet network/system, supplier, tax, VAT, verified final, status and stored source revision. Select a bar/quarter for source, verification/effective period and full component inspection.92/96/100-slot days and repeated autumn hours handled; tomorrow expands separately. Tables scroll on phones.
          - **Today's applied network tariff table:** only today's actual stored DSO rates, adjacent exact equal values merged with matching verification/source. Configured automatic Radius C labelled explicitly. Missing stored intervals remain unavailable; no seasonal/annual catalogue or guessed tariff.
          - **Native supported read-only transport/card:** authenticated HA WebSocket command, HA entity read permissions and one loaded site, bounded two local days. No large Recorder states, hundreds of entities, provider calls, SQL connections or tariff recomposition on dashboard reads. Bundled dependency-free custom card uses native static-file registration and Lovelace resource interface; no frontend/HACS monkeypatch or external CDN/library.
          - **Transparent readiness:** current/next independent of historical gaps. Independently verified raw spot stays visible when final supplier/tariff components are missing. Missing components, affected period, actionable correction, tomorrow publication guidance and next scheduled check remain visible. Retained stale amounts are labelled in the inspector and never plotted as verified.
          - **Cleaner device UI:** one-time integration-owned disabled default for unused estimated/unverified entities on existing sites; defaults disabled on new sites. Identities/history/user hides and disables preserved; later explicit opt-in survives reload. Configured provisional estimates remain labelled and outside verified/API data. Supported lowercase presentation enums display Ready/Incomplete/Stale/Error (localized); original canonical uppercase machine enums remain unchanged for compatibility.
          - **Existing engine preserved:** APIv1/coordinator/engine/SQLite/schedule/updater/source normalization/component arithmetic byte-identical to beta.7. Full-precision DKK/kWh CM API, negative prices, Radius transitions, dated national/supplier/VAT rules, historical revisions, settled values and refreshes **13:05,13:20,13:40,23:59,00:01** retained. No subscriptions in marginal costs, private contract/heating guesses or future EWII extrapolation. Historical EWII0.030DKK exVAT applies only June–September2026.

          ## Validation and integrity

          **324 producer tests/core**, HA **2026.10.3/current2026.10.4**, **89% coverage**, zero skips, two unchanged upstream HACS deprecation warnings. Four unchanged CM suites **153/176/227/228/core**, plus two coupled runtime cases/reference/core. **15 browser regressions** generated from real producer/source/SQLite data cover DST, both series/tables/all quarters, negative/zero, missing/unpublished/gaps, revisions, keyboard/mobile, EN/en-GB/DA/custom/browser numeric preferences and XSS. Official hassfest1integration/0invalid, HACS and both native package layouts outside source pass. All19 exact-source push/PR/tag/draft checks must pass before this release is uploaded.

          Native disposable **HA2026.10.4/frontend20260930.5**, desktop1440x1000/mobile390x844: both192-point graphs, all192 rows, four merged DSO ranges, source/components/future inspection, unpublished/raw-only/partial/gap/provisional sites, persisted Danish locale, live source revisions and optional device cleanup; zero browser errors/warnings. Provider-call counters unchanged on dashboard reads. Beta.7 upgrade preserved6configs/4ledgers/162original entity IDs. Restart preserves6configs/168IDs/**637price rows/revisions**/**14Recorder unit identities**.636 browser rows matched exact current OR historical SQLite revisions, all component/VAT/final/source values.14 screenshot hashes/source evidence are in the [native simulation receipt](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/v0.1.0-beta.8/docs/receipts/v0.1.0-beta.8-simulation.json). Synthetic/recorded data, **not owner real-HA acceptance**.

          Two fresh post-publication runner jobs independently download actual public assets, tagged source and compliant main; verify checksums/runtime bytes; exercise pinned actual **HACS2.0.5/upstream** register/discover/beta install/update/uninstall/reinstall plus both native ZIP layouts on both cores. Published beta7 must select8, installed8 remain current, stable exclude prereleases/hashes. The [publication receipt](https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/blob/feat/beta5-simple-onboarding/docs/receipts/v0.1.0-beta.8.json) is recorded after both succeed.

          SHA256:
          - HACS ZIP: `09c259261e494e4ee1c074d049679b480be63d2a24790ad65bc58846ce165a08`
          - Manual ZIP: `d181c4dc488d3633b2a75bbd80e39f75a85268651bca3ae5e43ee12857510337`
          - Download `BUILD_MANIFEST.json` and `SHA256SUMS` alongside the archives to verify exact source/member hashes.

          ## Limits

          Resource registration is one supported HA UI step; the card is not injected into HA's device page. Dedicated dashboard covers only today/tomorrow; canonical Python API history remains unchanged. Missing final ledger records cannot prove applied DSO/component values; the raw series may still be independently available. All-in inputs cannot reveal unknown component splits. Exact numeric canonical values/machine statuses intentionally remain technical; do not use rounded dashboard values for CM cost/control. User entity/card precision preferences outside this card remain user-owned.

          Actual private supplier/VAT/grid/heating terms, live provider availability and physical mobile/hardware acceptance remain owner checks. Public national baselines have bounded verified periods; other products/future rates need verified rules. New sites may have partial first-day history. HACS external catalog branding can fall back. **Cloud benchmarks do not establish Raspberry Pi performance**; original SQLite improvement remains intact and synchronous API history remains in RAM.

          No production HA, Node-RED, Tesla, Easee, CM source or charging commands touched. No main merge/stable release. Stop after beta.8 publication, independent verification and permanent handoff.
          PE_NOTES
          if gh release view "$PE_TAG" >/dev/null 2>&1; then
            python - <<'PY_EXISTING'
          import json,os,subprocess
          data=json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/releases/tags/{os.environ["PE_TAG"]}']))
          assert data['prerelease'] and not data['draft'] and data['tag_name']==os.environ['PE_TAG']
          assets={a['name']:a for a in data['assets']}
          expected=json.load(open('dist/BUILD_MANIFEST.json'))['archives']
          assert set(assets)=={*expected,'BUILD_MANIFEST.json','SHA256SUMS'}
          for name,digest in expected.items():assert assets[name]['digest']=='sha256:'+digest
          print('Existing immutable beta.8 matches authorized hashes; no release/asset mutation')
          PY_EXISTING
          else
            gh release create "$PE_TAG" dist/ha_energy_price_engine.zip dist/ha_energy_price_engine-manual.zip dist/BUILD_MANIFEST.json dist/SHA256SUMS --prerelease --latest=false --verify-tag --title 'v0.1.0-beta.8 — quarter-hour price dashboard and applied tariffs' --notes-file "$RUNNER_TEMP/pe-beta8-notes.md"
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$PE_TAG" --jq '{html_url,tag_name,draft,prerelease,assets:[.assets[].name]}'
  verify-public:
    name: Verify public beta.8 (${{ matrix.target }})
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ha-2026.10.3
            lockfile: requirements-dev.lock
          - target: ha-2026.10.4
            lockfile: requirements-ha-current.lock
    env:
      GH_TOKEN: ${{ github.token }}
      PE_SOURCE: cbad4e7595e7eba4080aca295bfca521f9b0409a
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v0.1.0-beta.8
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.8'
      - uses: astral-sh/setup-uv@v6
      - name: Prepare independent hash-verified core and actual HACS references
        run: |
          set -euo pipefail
          uv venv
          uv pip sync --require-hashes ${{ matrix.lockfile }}
          uv run --no-project python tools/prepare_hacs_reference.py
      - name: Independently download public assets and test HACS and both native layouts
        run: |
          set -euo pipefail
          uv run --no-project python tools/verify_public_release.py --expected-commit "$PE_SOURCE" --output "$RUNNER_TEMP/public-beta8"
          uv run --no-project python - <<'PY_CHANNEL'
          import json,os,subprocess
          from pathlib import Path
          from custom_components.ha_energy_price_engine.update import release_for
          feed=json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/releases']))
          assert release_for(feed,'0.1.0-beta.7')['tag_name']=='v0.1.0-beta.8'
          assert release_for(feed,'0.1.0-beta.8')['tag_name']=='v0.1.0-beta.8'
          stable=release_for(feed,'0.1.0')
          assert stable is None or (not stable['prerelease'] and '-' not in stable['tag_name'])
          path=Path(os.environ['RUNNER_TEMP'])/'public-beta8/PUBLIC_RELEASE_RECEIPT.json'
          data=json.loads(path.read_text())
          data['public_release_channel_selection']={'beta7_to_beta8':True,'installed_beta8_stays_current':True,'stable_excludes_beta_and_hashes':True}
          path.write_text(json.dumps(data,indent=2)+'\n')
          print('Public semantic release channel selection passed')
          PY_CHANNEL
      - uses: actions/upload-artifact@v4
        with:
          name: pe-beta8-public-${{ matrix.target }}
          path: ${{ runner.temp }}/public-beta8/PUBLIC_RELEASE_RECEIPT.json
          if-no-files-found: error
  audit:
    name: Record verified beta.8 publication
    needs: [publish, verify-public]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PE_SOURCE: cbad4e7595e7eba4080aca295bfca521f9b0409a
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/beta5-simple-onboarding
      - uses: actions/download-artifact@v5
        with:
          pattern: pe-beta8-public-*
          path: public-verification
      - name: Record public verification and preserve main and prior tags
        run: |
          set -euo pipefail
          python - <<'PY_AUDIT'
          import json,os,subprocess,urllib.request
          from pathlib import Path
          from datetime import UTC,datetime
          repository=os.environ['GITHUB_REPOSITORY'];source=os.environ['PE_SOURCE'];tag='v0.1.0-beta.8'
          def api(path):return json.loads(subprocess.check_output(['gh','api',f'repos/{repository}/{path}']))
          receipts={p.parent.name:json.loads(p.read_text()) for p in Path('public-verification').rglob('PUBLIC_RELEASE_RECEIPT.json')}
          assert len(receipts)==2
          expected={'ha_energy_price_engine.zip':'09c259261e494e4ee1c074d049679b480be63d2a24790ad65bc58846ce165a08','ha_energy_price_engine-manual.zip':'d181c4dc488d3633b2a75bbd80e39f75a85268651bca3ae5e43ee12857510337'}
          for receipt in receipts.values():
              assert receipt['source_commit']==source and receipt['archive_hashes']==expected
              assert receipt['isolated_hacs_and_native_install']=='passed'
              assert all(receipt['public_release_channel_selection'].values())
          release=api('releases/tags/'+tag)
          assert release['prerelease'] and not release['draft']
          assert api('commits/main')['sha']=='56cdb3c10993179371483812cbc36f651ba3ad8e'
          assert api('git/ref/tags/v0.1.0-beta.4')['object']['sha']=='90cb819f001fd390ca35e1c83f26d3c6303c4de1'
          assert api('git/ref/tags/v0.1.0-beta.3')['object']['sha']=='73b9e9e48d4cb17c69ecff4f77d9c992a5307516'
          prior=[]
          for number in range(1,8):
              previous=json.loads(Path(f'docs/receipts/v0.1.0-beta.{number}.json').read_text())
              oldtag=f'v0.1.0-beta.{number}'; old=api('releases/tags/'+oldtag)
              assert old['id']==previous['release_id'] and old['prerelease'] and not old['draft']
              assert api('git/ref/tags/'+oldtag)['object']['sha']==previous.get('tag_object',previous.get('annotated_tag_object'))
              assets={a['name']:a for a in old['assets']}
              for name,digest in previous.get('archive_hashes',previous.get('archive_sha256')).items():
                  assert assets[name]['digest']=='sha256:'+digest
              for asset in previous.get('assets',[]):
                  assert all(assets[asset['name']].get(k)==asset[k] for k in ('id','size','digest') if k in asset)
              prior.append({'tag':oldtag,'release_id':old['id'],'tag_and_asset_integrity_preserved':True})
          tag_object=api('git/ref/tags/'+tag)['object']['sha'];assert tag_object=='3dc0e28c119128e8ad397fc44da3b6b6c613b260'
          checks=api(f'commits/{source}/check-runs')['check_runs']
          assert len(checks)>=19 and all(c['conclusion']=='success' for c in checks)
          with urllib.request.urlopen(urllib.request.Request(release['html_url'],headers={'User-Agent':'PE-public-acceptance'}),timeout=30) as response:status=response.status
          assert status==200
          jobs=api(f'actions/runs/{os.environ["GITHUB_RUN_ID"]}/jobs')['jobs']
          completed=[j for j in jobs if j['name'].startswith(('publish','Verify public'))]
          assert len(completed)==3 and all(j['conclusion']=='success' for j in completed)
          report={'schema':1,'verified_at':datetime.now(UTC).isoformat(),'tag':tag,'source_commit':source,'tag_object':tag_object,'main_commit':'56cdb3c10993179371483812cbc36f651ba3ad8e','main_unmerged':True,'previous_releases_preserved':True,'prior_releases':prior,'release_url':release['html_url'],'release_id':release['id'],'draft':False,'prerelease':True,'unauthenticated_release_page_http':status,'archive_hashes':expected,'assets':[{k:a.get(k) for k in ('name','id','size','digest','browser_download_url')} for a in release['assets']],'publisher':{'id':int(os.environ['GITHUB_RUN_ID']),'html_url':f'https://github.com/{repository}/actions/runs/{os.environ["GITHUB_RUN_ID"]}','head_sha':os.environ['GITHUB_SHA'],'publication_and_both_verification_jobs':'success','workflow_final_conclusion':'pending audit completion'},'exact_source_checks':[{'name':c['name'],'id':c['id'],'conclusion':c['conclusion'],'url':c['html_url']} for c in checks],'validation':{'ha_cores':['2026.10.3','2026.10.4'],'producer_cases_per_core':324,'producer_coverage_percent':89,'browser_regressions':15,'native_dashboard_rows':192,'native_today_tariff_ranges':4,'skips':0,'warnings':'Two deprecation warnings in pinned upstream HACS code','unchanged_consumer_cases_per_core':{'pr15':153,'pr16':176,'pr25':227,'pr26':228},'actual_coupled_runtime_cases_per_consumer_per_core':2,'public_verification':'Fresh independent GitHub runner jobs on both locked cores; actual public metadata/assets/tag source/main plus unchanged pinned HACS2.0.5/upstream and both native ZIP layouts outside source','native_frontend':'Disposable HA2026.10.4/frontend20260930.5 EN/en-GB/DA desktop/mobile; synthetic boundaries','simulation_receipt':'docs/receipts/v0.1.0-beta.8-simulation.json','public_release_channel_selection':'beta7 chooses beta8; installed beta8 current; stable excludes prereleases/hashes'},'public_verification_receipts':receipts,'owner_acceptance':False,'remaining_limitations':['Register the bundled module once in HA Resources; dedicated dashboard only today/tomorrow.', 'Missing final ledger records cannot prove applied component/DSO values; all-in inputs cannot expose unknown split.', 'Canonical CM API DKK precision/machine states preserved; primary status display uses supported localized presentation enums.', 'Actual private contract/VAT/grid/heating, provider availability and physical hardware remain owner acceptance. National baselines are bounded, no future EWII inference.', 'Cloud benchmarks do not establish Raspberry Pi performance; original SQLite improvement and synchronous history-in-memory API retained.', 'HACS external brand catalog can show a fallback.'],'production_controls_touched':False}
          Path('docs/receipts/v0.1.0-beta.8.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          PY_AUDIT
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/receipts/v0.1.0-beta.8.json
          git commit -m 'docs: record independent public beta.8 verification on both cores'
          git push origin HEAD:refs/heads/feat/beta5-simple-onboarding
      - name: Update existing draft PR with verified prerelease
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/pe-beta8-pr.md" <<'PE_PR'
          Beta.8 is published and independently verified: https://github.com/NicolaiTandrup/HA-Energy-Price-Engine/releases/tag/v0.1.0-beta.8

          Exact source **cbad4e7595e7eba4080aca295bfca521f9b0409a**, immutable annotated tag v0.1.0-beta.8. This existing PR remains draft/unmerged; main and beta.1–.7 releases/tags/assets preserved. Owner authorizes only beta.8 prerelease.

          Delivers #10: bundled native Lovelace dashboard with today/tomorrow spot exVAT and verified final inclVAT graphs, every quarter's applied components/VAT/source/revision, today-only exact-merged DSO ranges, current/future inspection, Now/day markers and independent readiness. Ore/kWh2, negative prices, explicit missing/stale/error gaps, DST92/96/100/repeated offsets. Read-only authenticated bounded HA transport, local resource, complete copy/paste YAML; no third-party graphics plugins/CDNs or fake HA action. No provider fetch, SQL connection or tariff recomposition on reads. Original CM APIv1, engine/persistence/revisions/math/schedules/onboarding retained.

          Unused estimate entities receive one-time disabled defaults with identities/history/user preference preserved. Primary statuses localized Title Case through supported presentation enums; canonical machine states unchanged. Missing component/publication corrective guidance retained.9 core runtime files byte-identical beta7.

